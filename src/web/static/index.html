/* ------------------------------------------------------------------ 픽 */
/** 그 팀의 다음 빈칸. 손으로 판을 짤 때 한 팀을 차례로 채우게 한다 */
function nextEmptyIn(team){
  for(const r of ROLES){
    if(team === "ally" && r.key === state.myRole) continue;   // 내 자리는 ally에 넣지 않는다
    if(!state[team][r.key]) return {team, role: r.key};
  }
  return null;
}

/** 내 자리로 돌아온다 — 기본 상태 */
function goMine(){
  state.toMine = true;
  state.active = null;
  state.posTouched = false;   // 목표가 바뀌면 필터는 다시 그 자리를 따라간다
}

function pick(id){
  id = Number(id);
  if(state.banMode){
    state.bans.push(id);
  }else if(state.toMine){
    if(state.candidates.length >= 4) return;      // 4개 넘으면 카드가 못 읽게 좁아진다
    state.candidates.push(id);
  }else{
    const a = state.active;
    if(!a){ goMine(); return; }
    state[a.team][a.role] = id;
    markFixed(a.team, a.role);
    // 연동이 밴픽 중이면 판은 연동이 채운다 — 한 칸 빌려 쓰고 내 자리로 돌아온다.
    // 연동이 없으면 손으로 판을 짜는 중이니 그 팀의 다음 빈칸으로 넘어간다.
    if(state.lcu.status === "champ_select") goMine();
    else {
      const next = nextEmptyIn(a.team);
      if(next) state.active = next; else goMine();
    }
  }
  document.getElementById("q").value = "";
  state.cursor = 0;
  renderBoard(); renderGrid(); refresh();
  document.getElementById("q").focus();
}

function markFixed(team, role){
  state.fixed[team].add(role);
  delete state.slotMeta[team][role];
}

function resetDraft(){
  state.ally = {}; state.enemy = {}; state.bans = []; state.candidates = []; state.myPick = 0;
  state.banMode = false;
  state.fixed = {ally: new Set(), enemy: new Set()};
  state.slotMeta = {ally: {}, enemy: {}};
  goMine();
}

/* ------------------------------------------------------------------ 자리 바꾸기 (끌어다 놓기) */
let dragFrom = null;

function dropTarget(e){
  const el = e.target.closest?.("[data-slot]");
  if(!el || !dragFrom) return null;
  const [team, role] = el.dataset.slot.split(":");
  // 같은 팀 안에서만. 내 자리에는 놓지 않는다.
  if(team !== dragFrom.team || role === dragFrom.role) return null;
  if(team === "ally" && role === state.myRole) return null;
  return {el, team, role};
}

function moveSlot(team, from, to){
  const board = state[team];
  const a = board[from], b = board[to];
  if(b) board[from] = b; else delete board[from];
  board[to] = a;
  // 옮긴 칸은 전부 사람이 정한 것이 된다
  for(const role of [from, to]){
    if(board[role]) markFixed(team, role);
    else { state.fixed[team].delete(role); delete state.slotMeta[team][role]; }
  }
}

document.addEventListener("dragstart", e => {
  const el = e.target.closest?.("[data-slot]");
  if(!el) return;
  const [team, role] = el.dataset.slot.split(":");
  if(!state[team][role] || (team === "ally" && role === state.myRole)){ e.preventDefault(); return; }
  dragFrom = {team, role};
  el.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", el.dataset.slot);
});
document.addEventListener("dragover", e => {
  document.querySelectorAll(".slot.dropover").forEach(x => x.classList.remove("dropover"));
  const d = dropTarget(e);
  if(!d) return;
  e.preventDefault();
  d.el.classList.add("dropover");
});
document.addEventListener("drop", e => {
  const d = dropTarget(e);
  if(!d) return;
  e.preventDefault();
  moveSlot(d.team, dragFrom.role, d.role);
  dragFrom = null;
  // 빌린 칸이 자리를 옮겨 채워졌으면 내 자리로 돌아온다
  if(!state.toMine && state.active && state[state.active.team][state.active.role]) goMine();
  renderBoard(); renderGrid(); refresh();
});
document.addEventListener("dragend", () => {
  if(!dragFrom) return;
  dragFrom = null;
  renderBoard();
});

/* ------------------------------------------------------------------ 클라이언트 연동 */
function fixedParam(){
  const out = [];
  for(const [team, key] of [["ally", "a"], ["enemy", "e"]])
    for(const role of state.fixed[team])
      if(state[team][role]) out.push(`${key}:${role}:${state[team][role]}`);
  return out.join(",");
}

const LCU_LABEL = {offline: L("클라이언트 꺼짐", "Client offline"), idle: L("클라이언트 대기", "Client idle"), champ_select: L("밴픽 중", "In champ select")};
const sameBoard = (a, b) => JSON.stringify(Object.entries(a).sort()) === JSON.stringify(Object.entries(b).sort());

function applyLcu(d){
  if(d.boot){                                   // 서버를 다시 켰으면 화면도 새 코드로
    if(state.boot && state.boot !== d.boot) return location.reload();
    state.boot = d.boot;
  }
  const dot = document.getElementById("lcu");
  dot.className = "lcu" + (d.status === "champ_select" ? " on" : d.status === "idle" ? " idle" : "");
  dot.querySelector("span").textContent = LCU_LABEL[d.status] ?? LCU_LABEL.offline;
  dot.title = dot.querySelector("span").textContent;
  // 밴픽이 끝나도 마지막 상태를 지우지 않는다 — 로딩 화면에서 다시 볼 수 있게
  if(d.status !== "champ_select"){ state.lcu.status = d.status; voiceOnFlow(d.flow ?? ""); onLoadingFlow(d.flow ?? ""); return; }
  // 끄는 중에 판을 다시 그리면 끌기가 끊긴다
  if(dragFrom) return;

  let changed = false;
  if(d.sessionSeq !== state.lcu.seq){ resetDraft(); state.lcu.seq = d.sessionSeq; changed = true; voice.last = ""; loadFriends(); closeLoading(); }
  state.lcu.status = d.status;
  voiceOnLcu(d);
  if(d.myRole && d.myRole !== state.myRole){
    state.myRole = d.myRole;
    state.candidates = [];
    changed = true;
  }
  // 내가 확정하면 내 칸에 넣고, 고민 중 맨 앞에 올려 승률과 다른 선택지 대비를 보게 한다
  const myPick = d.myPick || 0;
  if(myPick !== state.myPick){
    state.myPick = myPick;
    if(myPick && !state.candidates.includes(myPick))
      state.candidates = [myPick, ...state.candidates].slice(0, 4);
    changed = true;
  }
  for(const team of ["ally", "enemy"]){
    const next = {}, meta = {};
    for(const [role, v] of Object.entries(d[team] || {})){
      if(team === "ally" && role === state.myRole) continue;
      next[role] = v.championId;
      if(!v.fixed) meta[role] = v;
    }
    // 지정한 칸은 서버에 제약으로 넘겼지만, 응답이 한 박자 늦을 수 있어 화면 쪽 값을 한 번 더 지킨다
    for(const role of state.fixed[team]) if(state[team][role]) next[role] = state[team][role];
    if(!sameBoard(next, state[team])){ state[team] = next; changed = true; }
    state.slotMeta[team] = meta;
  }
  const bans = [...new Set([...state.bans, ...(d.bans || [])])];
  if(bans.length !== state.bans.length){ state.bans = bans; changed = true; }

  if(changed){
    // 빌린 칸을 연동이 채워 줬으면 내 자리로 돌아온다. 그 밖에는 목표를 건드리지 않는다 —
    // 1초마다 도는 폴링이 사람이 고른 자리를 빼앗으면 안 된다
    if(!state.toMine && (!state.active || state[state.active.team][state.active.role])) goMine();
    renderHeader(); renderBoard(); renderGrid(); refresh();
  }
}

async function pollLcu(){
  try{
    const res = await fetch("/api/lcu?" + new URLSearchParams({fixed: fixedParam(), lang: LANG}));
    applyLcu(await res.json());
  }catch{
    applyLcu({status: "offline"});
  }
  setTimeout(pollLcu, 1000);
}

/* ------------------------------------------------------------------ 풀 편집 */
function renderPoolModal(){
  document.getElementById("poolroles").innerHTML = ROLES.map(r =>
    `<button data-poolrole="${r.key}" aria-pressed="${r.key===state.poolRole}">${roleName(r)}</button>`).join("");

  const ids = state.pool[state.poolRole] ?? [];
  document.getElementById("poolchips").innerHTML = ids.length
    ? ids.map(id => `<span class="chip"><img src="${portrait(id)}" alt="">${nameOf(id)}
         <button data-poolremove="${id}" title="${L("빼기", "Remove")}">×</button></span>`).join("")
    : `<div class="none">${L("아직 없습니다. 아래에서 검색해 추가하세요.", "Nothing yet. Search below to add champions.")}</div>`;

  // 기록으로 채우기 — 이 자리에서 5판 이상 한 것 중 풀에 없는 것만
  const missing = (state.mePool[state.poolRole] ?? []).filter(id => !ids.includes(id));
  const fill = document.getElementById("poolfill");
  fill.hidden = !Object.keys(state.mePool).length;
  document.getElementById("fillpool").disabled = !missing.length;
  document.getElementById("fillpool").style.opacity = missing.length ? "" : ".45";
  document.getElementById("poolfillnote").textContent = missing.length
    ? L(`이 자리에서 5판 이상 한 챔피언 ${missing.length}개를 더합니다 — ${missing.map(nameOf).join(", ")}`,
        `Adds ${missing.length} champions you've played 5+ games in this role — ${missing.map(nameOf).join(", ")}`)
    : L(`이 자리에서 5판 이상 한 챔피언은 이미 다 들어 있습니다`, `All champions you've played 5+ games in this role are already in`);

  state.poolResults = search(document.getElementById("poolq").value, new Set(ids));
  document.getElementById("poolgrid").innerHTML = state.poolResults.map(([id,c]) =>
    `<button data-pooladd="${id}"><img src="${portrait(id)}" alt="" loading="lazy">
       <span>${champName(c)}</span></button>`).join("") || `<div class="empty">${L("결과 없음", "No results")}</div>`;
}

function openPool(){
  state.poolRole = state.myRole;
  document.getElementById("poolq").value = "";
  document.getElementById("poolmodal").hidden = false;
  renderPoolModal();
  document.getElementById("poolq").focus();
}
function closePool(){
  document.getElementById("poolmodal").hidden = true;
  renderHeader(); refresh();
  document.getElementById("q").focus();
}

/* ------------------------------------------------------------------ 이벤트 */
document.addEventListener("click", e => {
  const t = e.target;

  if(t.closest("[data-openpool]") || t.closest("#openpool")) return openPool();
  if(t.closest("#closepool")) return closePool();
  if(t.id === "poolmodal") return closePool();          // 바깥 클릭

  const pr = t.closest("[data-poolrole]");
  if(pr){ state.poolRole = pr.dataset.poolrole; renderPoolModal(); return; }

  const pa = t.closest("[data-pooladd]");
  if(pa){
    const id = Number(pa.dataset.pooladd);
    (state.pool[state.poolRole] ??= []).push(id);
    savePool(); document.getElementById("poolq").value = "";
    renderPoolModal(); document.getElementById("poolq").focus(); return;
  }
  if(t.closest("#fillpool")){
    const add = (state.mePool[state.poolRole] ?? []).filter(id => !state.pool[state.poolRole].includes(id));
    state.pool[state.poolRole].push(...add);
    savePool(); renderPoolModal(); renderHeader(); refresh(); return;
  }
  const prm = t.closest("[data-poolremove]");
  if(prm){
    const id = Number(prm.dataset.poolremove);
    state.pool[state.poolRole] = state.pool[state.poolRole].filter(x => x!==id);
    savePool(); renderPoolModal(); return;
  }

  const posBtn = t.closest("[data-pos]");
  if(posBtn){
    state.posFilter = posBtn.dataset.pos;
    state.posTouched = true;            // 그 뒤로는 내 라인을 따라가지 않는다
    state.cursor = 0;
    renderGrid(); document.getElementById("q").focus(); return;
  }

  const roleBtn = t.closest("[data-role]");
  if(roleBtn){
    state.myRole = roleBtn.dataset.role;
    delete state.ally[state.myRole];               // 내 자리는 비운다
    state.myPick = 0;                              // 확정 픽은 원래 라인 것이다
    state.candidates = [];                         // 라인이 바뀌면 후보도 의미가 없다
    goMine();
    renderHeader(); renderBoard(); renderGrid(); refresh(); return;
  }
  if(t.closest("#banadd")){
    state.banMode = !state.banMode;
    renderBoard(); renderGrid(); document.getElementById("q").focus(); return;
  }
  const unban = t.closest("[data-unban]");
  if(unban){
    state.bans = state.bans.filter(x => x !== Number(unban.dataset.unban));
    renderBoard(); renderGrid(); refresh(); return;
  }
  const clr = t.closest("[data-clear]");
  if(clr){
    const [team, role] = clr.dataset.clear.split(":");
    delete state[team][role];
    state.fixed[team].delete(role);
    delete state.slotMeta[team][role];
    e.stopPropagation();
    state.toMine = false; state.active = {team, role}; state.posTouched = false;
    renderBoard(); renderGrid(); refresh(); return;
  }
  const cv = t.closest("[data-curve]");
  if(cv){
    const id = Number(cv.dataset.curve);
    const box = cv.nextElementSibling;
    const open = box.hidden;
    box.hidden = !open;
    cv.textContent = open ? L("시간대 접기", "Hide by game length") : L("시간대별 보기", "By game length");
    open ? state.curveOpen.add(id) : state.curveOpen.delete(id);
    return;
  }
  const drop = t.closest("[data-dropcand]");
  if(drop){
    const id = Number(drop.dataset.dropcand);
    state.candidates = state.candidates.filter(x => x !== id);
    renderBoard(); renderGrid(); refresh(); return;
  }
  if(t.closest("#reset")){
    resetDraft();
    document.getElementById("q").value = "";
    renderHeader(); renderBoard(); renderGrid(); refresh();
    document.getElementById("q").focus(); return;
  }

  const slot = t.closest("[data-slot]");
  if(slot){
    const [team, role] = slot.dataset.slot.split(":");
    if(team==="ally" && role===state.myRole){          // 내 자리 = 기본으로 돌아오기
      state.banMode = false;
      goMine();
      renderBoard(); renderGrid();
      document.getElementById("q").focus(); return;
    }
    state.banMode = false; state.toMine = false;
    state.active = {team, role};
    state.posTouched = false;   // 빌린 자리의 라인을 따라간다
    renderBoard(); renderGrid(); document.getElementById("q").focus(); return;
  }
  const p = t.closest("[data-pick]");
  if(p) pick(p.dataset.pick);
});

document.getElementById("iron").addEventListener("change", e => {
  state.iron = e.target.checked;
  state.tier = state.iron ? "IRON" : state.baseTier;
  saveIron(); refresh();
});
document.getElementById("onlyhere").addEventListener("change", e => {
  state.hideOffRole = e.target.checked;
  saveOffRole(); refresh();
});
document.getElementById("q").addEventListener("input", () => { state.cursor=0; renderGrid(); });
document.getElementById("poolq").addEventListener("input", renderPoolModal);

// 키 입력은 문서 전체에서 받는다. 밴픽 중에는 마우스를 옮기다 포커스가 자주 풀리는데,
// 그때마다 입력창을 다시 클릭하게 만들면 몇 초를 버린다.
document.addEventListener("keydown", e => {
  const open = !document.getElementById("poolmodal").hidden;
  const box = document.getElementById(open ? "poolq" : "q");

  if(e.key === "Escape"){
    if(open) return closePool();
    if(box.value){ box.value=""; state.cursor=0; renderGrid(); return; }
    if(state.banMode || !state.toMine){             // 빌린 자리·밴을 놓고 내 자리로
      state.banMode = false;
      goMine();
      renderBoard(); renderGrid();
    }
    return;
  }
  if(e.key === "Enter"){
    e.preventDefault();
    if(open){
      const first = state.poolResults[0];
      if(first){
        (state.pool[state.poolRole] ??= []).push(Number(first[0]));
        savePool(); box.value=""; renderPoolModal();
      }
      return;
    }
    if(state.results.length) pick(state.results[state.cursor][0]);
    return;
  }
  if(!open && e.key === "ArrowRight"){ state.cursor++; renderGrid(); e.preventDefault(); return; }
  if(!open && e.key === "ArrowLeft"){ state.cursor=Math.max(0,state.cursor-1); renderGrid(); e.preventDefault(); return; }
  if(document.activeElement !== box && e.key.length===1 && !e.ctrlKey && !e.metaKey) box.focus();
});

/* ------------------------------------------------------------------ 음성 브리핑 (음성 팩: data/voice/<언어>/*.ogg)
   두 번 말한다. 미리 뽑은 통문장 클립을 차례로 튼다. 한국어 음성뿐이라 영어 화면에서는 영어 팩이 없으면 조용하다.
     내 픽 차례    "현재 승리 확률이 제일 높은 픽은 요네네요." "챔피언 풀 중에서는 아리가 제일 높아요."
                   "고민 중인 챔피언 중에서는 모르가나가 가장 좋아요."
     게임 들어갈 때 "예상 승리 확률은 오십이 쩜 삼 퍼센트예요." "초반에 강하고 후반에 약한 조합이에요."
                   "럭스 상대로 승률이 좋아요." "다섯 판 만나서 세 판 이겼어요."
   클라이언트와 연결돼 있으면 내 픽 차례가 올 때 · 픽이 다 끝났을 때(FINALIZATION) 읽는다.
   손으로 판을 짤 때는 판이 다 차면 게임 브리핑, 그 전에는 픽 브리핑 — 읽을 내용이 바뀔 때마다.
   클립이 없는 문장은 건너뛴다 (음성 팩에 있는 것만). 행동 지시는 하지 않는다. */
const VOICE_AUTO_KEY = "draft.voiceAuto.v1";
/* 자동 음성은 창 하나만 — 3_Open.cmd를 두 번 눌러 탭이 둘이면 같은 말을 동시에 해서 겹친다.
   먼저 연 탭이 잠금을 쥐고, 그 탭을 닫으면 다음 탭이 이어받는다. 브리핑 버튼은 어느 탭이든 읽는다 */
const voice = {lang: LANG === "en" ? "en" : "ko", have: new Set(), ctx: null, buf: new Map(), playing: null, last: "", autoPref: false, timer: 0,
               data: null, turn: false, phase: "", flow: "", leader: !navigator.locks,
               get auto(){ return this.autoPref && this.leader; }, set auto(v){ this.autoPref = v; }};
navigator.locks?.request("picknote-voice", () => { voice.leader = true; voiceLockShow?.(); return new Promise(() => {}); });
const VOICE_GAP = 0.3;              // 문장 사이 쉼 (초)
const VOICE_REC_WHOLE = 12;         // 맞라인 기록: 12판까지는 통문장, 넘으면 "n판 만나서," + "w판 이겼어요."
const POWER_PP = 3;                 // 초반(~20분)과 후반(30분~) 승률 차가 이만큼 나야 "강하다/약하다"

const best = rows => rows.length ? rows.reduce((a, b) => b.winrate > a.winrate ? b : a) : null;
/** 내 챔피언 — 클라이언트에서 확정한 픽, 손으로 판을 다 채웠으면 고민 중 맨 앞 */
function voiceMyChamp(){
  if(state.myPick) return state.myPick;
  const full = Object.keys(state.ally).length >= 4 && Object.keys(state.enemy).length >= 5;
  return full ? state.candidates[0] ?? 0 : 0;
}
/** 내 픽 차례 — 전체 최고 · 내 풀 최고 · 고민 중 최고. 앞 문장과 같은 챔피언이면 건너뛴다 */
function voicePickScript(data){
  if(!data) return [];
  const cands = data.candidates ?? [], all = [...(data.others ?? []), ...cands];
  if(!all.length) return ["none"];
  const top = best(all), pool = state.pool[state.myRole] ?? [];
  const inPool = best(all.filter(r => pool.includes(r.championId)));
  const cand = cands.length >= 2 ? best(cands) : null;
  const out = [`top_${top.championId}`];
  if(inPool && inPool.championId !== top.championId) out.push(`pool_${inPool.championId}`);
  if(cand && cand.championId !== top.championId && cand.championId !== inPool?.championId) out.push(`cand_${cand.championId}`);
  return out;
}
/** 파워 커브 — 시간대별 곡선의 앞(~20분)과 뒤(30분~ 두 칸 평균)를 견준다 */
function voicePower(c){
  if(!c || c.length < 4) return null;
  const d = (c[c.length - 1] + c[c.length - 2]) / 2 - c[0];
  return d <= -POWER_PP ? "pc_early" : d >= POWER_PP ? "pc_late" : "pc_even";
}
/** 게임 들어갈 때 — 예상 승리 확률 · 파워 커브 · 맞라인 상대 내 기록 */
function voiceGameScript(data){
  const me = voiceMyChamp();
  if(!data || !me) return [];
  const row = [...(data.candidates ?? []), ...(data.others ?? [])].find(r => r.championId === me);
  const out = [];
  if(row){
    out.push(`gw${Math.round(row.winrate * 10)}`);
    const pc = voicePower(row.curve);
    if(pc) out.push(pc);
  }
  const foe = data.myLane?.rows?.find(r => r.kind === "foe");
  if(foe && foe.games >= 3 && foe.wins != null){
    const c = foe.champs[0], n = foe.games, w = foe.wins;
    out.push(`${w * 2 > n ? "fg" : w * 2 < n ? "fb" : "fe"}_${c}`);
    if(voice.have.has(out[out.length - 1])) out.push(...(n <= VOICE_REC_WHOLE ? [`rec${n}_${w}`] : [`rn${n}`, `rw${w}`]));
  }
  return out;
}
/** 지금 읽을 것. kind 를 안 주면 판 상태로 고른다 */
function voiceScript(data, kind){
  kind ??= voiceMyChamp() ? "game" : "pick";
  const ids = kind === "game" ? voiceGameScript(data) : voicePickScript(data);
  // 기록 두 조각은 둘 다 있어야 읽는다
  return ids.filter((id, i) => voice.have.has(id) && (!id.startsWith("rn") || voice.have.has(ids[i + 1])) && (!id.startsWith("rw") || voice.have.has(ids[i - 1])));
}
/* 오늘의 목표 음성 — 하루 첫 로딩 화면 음성 앞에 목표 한 문장, 판이 끝나 기록이 들어오면 달성 · 오늘 몇 판 중 몇 판.
   클립 id 는 음성 팩에 든 숫자 범위와 맞춘다. 숫자는 화면 목표를 반올림 (데스는 내림 — "이하"라서) */
const VOICE_GOAL_RANGE = {ctrl:[1, 15, 1], deaths:[2, 10, 1], cs15:[40, 160, 5], vision:[5, 40, 1], kp:[25, 75, 1], kp15:[25, 75, 1], dmg:[150, 1500, 50]};
const VOICE_GOAL_KEY = "draft.voiceGoal.v1";      // {said: "날짜:자리", heard: 마지막으로 알려 준 판 시각}
function voiceGoalStore(patch){
  let s = {};
  try{ s = JSON.parse(localStorage.getItem(VOICE_GOAL_KEY)) || {}; }catch{}
  if(patch){ s = {...s, ...patch}; try{ localStorage.setItem(VOICE_GOAL_KEY, JSON.stringify(s)); }catch{} }
  return s;
}
/** 지금 자리의 목표 줄 — 화면 한 줄(renderGoalBar)과 같은 것을 고른다 */
function voiceGoalRow(pos){
  const G = goalData;
  if(!G?.available) return null;
  pos = pos && G.pos[pos] ? pos : (G.pos[state.myRole] ? state.myRole : G.main);
  const P = G.pos[pos], r = P?.rows.find(x => x.k === P.pick);
  return r ? {pos, r} : null;
}
function voiceGoalClip(r){
  const R = VOICE_GOAL_RANGE[r.k];
  if(!R) return null;
  let v = r.k === "kp" || r.k === "kp15" ? r.target * 100 : r.k === "vision" ? r.target * 10 : r.target;
  v = r.k === "deaths" ? Math.floor(v + 1e-9) : Math.round(v / R[2]) * R[2];
  return v >= R[0] && v <= R[1] ? `g_${r.k}_${v}` : null;
}
/** 하루 첫 로딩 화면에서 읽을 목표 문장 (자리가 바뀌면 그 자리 목표를 한 번 더) */
function voiceGoalIntro(pos){
  const g = voiceGoalRow(pos);
  if(!g) return [];
  const tag = `${goalData.dayStart}:${g.pos}`;
  if(voiceGoalStore().said === tag) return [];
  const ids = [voiceGoalClip(g.r), g.r.mode === "keep" ? "g_keep" : null].filter(id => id && voice.have.has(id));
  if(ids.length) voiceGoalStore({said: tag});
  return ids;
}
/** 기록이 새로 들어왔으면 — 그 판 자리의 목표로 달성 여부와 오늘 성적 */
function voiceGoalResult(){
  const G = goalData;
  if(!G?.available || !G.today.length) return;
  const last = G.today[G.today.length - 1], st = voiceGoalStore();
  if(st.heard == null || last.t <= st.heard){ if(st.heard == null || last.t > st.heard) voiceGoalStore({heard: last.t}); return; }
  voiceGoalStore({heard: last.t});
  if(!voice.auto || !voice.ctx || voice.playing) return;
  const g = voiceGoalRow(last.pos);
  if(!g || g.pos !== last.pos) return;
  const hits = G.today.filter(x => x.pos === g.pos).map(x => x.hits[g.r.k]).filter(Boolean);
  const h = last.hits[g.r.k];
  if(!h || !hits.length) return;
  const n = hits.length, m = hits.filter(x => x.ok).length;
  const ids = n === 1 ? [`g_day1_${m}`] : [h.ok ? "g_hit" : "g_miss", ...(n <= 15 ? [`g_day${n}_${m}`] : [])];
  voiceSpeak(ids.filter(id => voice.have.has(id)));
}
/* 기울어짐 — 게임이 끝나 로비로 돌아왔을 때, 다음 큐를 누르기 전에 사실만. 같은 자리에 앉아 이어 한 판(앞 판이 끝나고 1시간 안)이 기준.
   A 같은 자리에서 3연패 이상 → "세 판 연달아 아쉬웠어요…" (연패 수가 늘 때마다 한 번)
   B 이번이 다섯 판째 이상 → "벌써 다섯 판째예요." + 내 기록에서 그 판째부터 승률이 첫 판보다 3%p 넘게 낮으면 그 숫자 (자리마다 한 번)
   오늘 판은 클라이언트 최근 전적으로 본다 (/api/me/session) */
const TILT_FROM_MIN = 15;           // "n판째부터 승률" 은 이만큼 판이 있어야 말한다
async function voiceTilt(){
  let s;
  try{ s = await fetch("/api/me/session").then(r => r.ok ? r.json() : null); }catch{ s = null; }
  if(!s?.played) return [];
  const st = voiceGoalStore(), ids = [], patch = {};
  if(s.streak >= 3){
    const n = Math.min(s.streak, 5), tag = `${s.start}:${n}`;
    if(st.tiltL !== tag){ ids.push(`t_lose${n}`); patch.tiltL = tag; }
  }
  const k = s.played + 1;
  if(k >= 5 && st.tiltN !== s.start){
    ids.push(`t_n${Math.min(k, 11)}`); patch.tiltN = s.start;
    const from = [8, 7, 6, 5].find(f => f <= k && (s.wrFrom[f]?.n ?? 0) >= TILT_FROM_MIN);
    const wr = from && Math.round(s.wrFrom[from].wr);
    if(from && s.first?.wr != null && wr <= s.first.wr - 3 && wr >= 20 && wr <= 70) ids.push(`t_wr${from}_${wr}`);
  }
  const have = ids.filter(id => voice.have.has(id));
  if(have.length) voiceGoalStore(patch);
  return have;
}
const FLOW_GAME = new Set(["InProgress", "WaitingForStats", "PreEndOfGame", "EndOfGame", "Reconnect"]);
/** 게임 → 로비(또는 대기)로 넘어온 순간 한 번. 최근 전적에 방금 판이 들어오도록 잠깐 기다린다 */
function voiceOnFlow(flow){
  const prev = voice.flow; voice.flow = flow;
  if(!FLOW_GAME.has(prev) || FLOW_GAME.has(flow) || !flow) return;
  setTimeout(async () => {
    const fb = await loadFeedback();              // 팝업은 음성이 꺼져 있어도 띄운다
    if(!voice.auto || !voice.ctx || voice.playing) return;
    await voiceRefresh();
    const ids = [...(fb?.say ?? []), ...await voiceTilt()].filter(id => voice.have.has(id));
    if(ids.length) voiceSpeak(ids);
  }, 4000);
}
/** 친구 알림 음성 — 밴픽이 시작되고 잠깐 뒤. 내 픽 차례 브리핑은 이 문장이 끝날 때까지 기다린다 (voice.keep) */
function voiceFriend(F){
  if(!voice.auto || !voice.ctx) return;
  const T = F.together, top = F.friends.reduce((a, b) => b.games > a.games ? b : a);
  const id = T && T.games >= FRIEND_MIN ? `f_many_${Math.round(100 * T.wins / T.games)}` : `f_one_${Math.round(100 * top.wins / top.games)}`;
  const tag = `${goalData?.dayStart ?? new Date().toDateString()}:${F.friends.map(f => f.name).sort().join(",")}`;
  if(voiceGoalStore().friend === tag || !voice.have.has(id)) return;
  voiceGoalStore({friend: tag});
  setTimeout(() => {
    if(voice.playing) return;
    voice.keep = new Promise(done => { voiceSpeak([id]).then(() => {
      const end = voice.playing?.[voice.playing.length - 1];
      if(end){ const prev = end.onended; end.onended = e => { prev?.(e); done(); }; } else done();
    }); }).finally(() => { voice.keep = null; });
  }, 1500);
}
async function voiceRefresh(){
  try{ voice.have = new Set((await fetch("/api/voice").then(r => r.json()))[voice.lang] ?? []); }catch{}
}
async function voiceClip(id){
  if(!voice.buf.has(id)){
    voice.buf.set(id, fetch(`/voice/${voice.lang}/${id}.ogg`).then(r => r.arrayBuffer())
      .then(b => voice.ctx.decodeAudioData(b)).catch(() => null));
  }
  return voice.buf.get(id);
}
function voiceStop(){
  for(const s of voice.playing ?? []) try{ s.stop(); }catch{}
  voice.playing = null;
  document.getElementById("voiceplay").setAttribute("aria-pressed", "false");
}
/** 브라우저 자동 재생 제한 — 페이지를 열고 화면을 한 번 누르기 전에는 소리가 막힌다.
    자동이 켜져 있으면 열자마자 소리 상자를 만들어 두고, 아무 데나 처음 누를 때 풀어 준다.
    막힌 채로 읽을 차례가 오면 알림을 깜빡이고, 30초 안에 누르면 그때 읽는다 */
function voiceLockShow(){
  const el = document.getElementById("voicelock");
  el.hidden = !(voice.auto && voice.ctx && voice.ctx.state !== "running");
}
function voiceUnlock(){
  if(!voice.ctx) return;
  voice.ctx.resume().then(() => {
    voiceLockShow();
    const p = voice.pending; voice.pending = null;
    if(p && Date.now() - p.at < 30000 && !voice.playing) voiceSpeak(p.ids, true);
  }).catch(() => {});
}
function voiceCtx(){
  if(voice.ctx) return voice.ctx;
  voice.ctx = new AudioContext();
  voice.ctx.onstatechange = voiceLockShow;
  voiceLockShow();
  return voice.ctx;
}
/** manual = 브리핑 버튼. 자동으로 읽을 때는 서버에 먼저 물어 같은 말을 다른 탭·브라우저가 이미 읽었으면 조용히 있는다.
    읽기 준비(클립 받기)를 기다리는 사이 다른 읽기가 시작되면 먼저 것은 버린다 — 둘 다 소리 나서 겹치지 않게 */
async function voiceSpeak(ids, manual){
  voiceStop();
  if(!ids.length) return;
  const gen = voice.gen = (voice.gen ?? 0) + 1;
  if(!manual){
    try{
      const r = await fetch("/api/voice/claim", {method: "POST", headers: {"Content-Type": "application/json"},
                                                body: JSON.stringify({key: ids.join(",")})}).then(r => r.json());
      if(r.ok === false) return;           // 서버가 옛날 것이면 답이 달라서 그냥 읽는다
    }catch{}
    if(gen !== voice.gen) return;
  }
  voiceCtx();
  if(voice.ctx.state !== "running"){          // 손짓 없이 resume() 은 끝나지 않고 매달려 있어서 잠깐만 기다린다
    await Promise.race([voice.ctx.resume().catch(() => {}), new Promise(r => setTimeout(r, 300))]);
  }
  if(voice.ctx.state !== "running"){
    voice.pending = {ids, at: Date.now()};
    const el = document.getElementById("voicelock");
    voiceLockShow(); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    return;
  }
  const bufs = await Promise.all(ids.map(voiceClip));
  if(gen !== voice.gen) return;
  voiceStop();
  const mine = voice.playing = [];
  let t = voice.ctx.currentTime + 0.05;
  ids.forEach((id, i) => {
    const b = bufs[i];
    if(!b) return;
    const src = voice.ctx.createBufferSource();
    src.buffer = b; src.connect(voice.ctx.destination); src.start(t);
    mine.push(src);
    t += b.duration + VOICE_GAP;
  });
  document.getElementById("voiceplay").setAttribute("aria-pressed", "true");
  const end = mine[mine.length - 1];
  if(end) end.onended = () => { if(voice.playing === mine) voiceStop(); };
}
/** 추천이 새로 오면 부른다. 자동이 켜져 있고 읽을 내용이 바뀌었으면 잠깐 기다렸다 읽는다 (픽을 연달아 넣는 중일 수 있다) */
/** 잠깐 기다렸다 읽는다 — 그사이 추천이 새로 올 수 있어서, 읽을 때 가장 새 추천을 쓴다 */
function voiceLater(kind, force){
  clearTimeout(voice.timer);
  if(!voice.auto || !voice.ctx) return;      // 소리는 버튼이나 자동 체크를 한 번 누른 뒤부터 (브라우저 자동 재생 제한)
  voice.timer = setTimeout(async () => {
    if(voice.keep) await voice.keep;          // 친구 알림이 끝나고 읽는다
    await voiceRefresh();
    const ids = voiceScript(voice.data, kind), key = kind + ":" + ids.join(",");
    if(!ids.length || (!force && key === voice.last)) return;
    voice.last = key; voiceSpeak(ids);
  }, 1500);
}
/** 추천이 새로 오면 부른다. 클라이언트와 연결돼 있으면 차례 신호로만 읽는다 (voiceOnLcu) */
function voiceOnData(data){
  voice.data = data;
  if(state.lcu.status === "champ_select") return;
  voiceLater(voiceMyChamp() ? "game" : "pick", false);
}
/** 클라이언트 신호 — 내 픽 차례가 시작될 때, 픽이 다 끝났을 때 한 번씩 */
function voiceOnLcu(d){
  if(d.myTurn && !voice.turn) voiceLater("pick", true);
  if(d.phase === "FINALIZATION" && voice.phase !== "FINALIZATION") voiceLater("game", true);
  voice.turn = !!d.myTurn; voice.phase = d.phase ?? "";
}
async function voiceInit(){
  await voiceRefresh();
  if(!voice.have.size) return;
  document.getElementById("voice").hidden = false;
  try{ voice.auto = localStorage.getItem(VOICE_AUTO_KEY) === "1"; }catch{}
  const auto = document.getElementById("voiceauto");
  auto.checked = voice.autoPref;
  auto.addEventListener("change", e => {
    voice.auto = e.target.checked;
    try{ localStorage.setItem(VOICE_AUTO_KEY, voice.auto ? "1" : "0"); }catch{}
    if(voice.autoPref) voiceCtx();
    voiceLockShow();
  });
  if(voice.autoPref) voiceCtx();                // 열자마자 — 처음 누르는 순간 바로 풀리게
  for(const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, voiceUnlock, true);
  document.getElementById("voiceplay").addEventListener("click", async () => {
    if(voice.playing) return voiceStop();
    await voiceRefresh();          // 음성 팩을 새로 받았으면 그새 늘었을 수 있다
    const kind = voiceMyChamp() ? "game" : "pick", ids = voiceScript(voice.data, kind);
    voice.last = kind + ":" + ids.join(",");
    voiceSpeak(ids, true);
  });
}

/* ------------------------------------------------------------------ 시작 */
(async function init(){
  loadPool(); loadOffRole(); loadIron();
  document.getElementById("onlyhere").checked = state.hideOffRole;
  document.getElementById("posfilter").setAttribute("aria-label", L("포지션 필터", "Position filter"));
  const meta = await fetch(`/api/meta?lang=${LANG}`).then(r=>r.json());
  state.champions = Object.fromEntries(
    Object.entries(meta.champions).map(([k,v]) => [Number(k), v]));
  state.version = meta.version;
  // 아이언에만 보정이 있을 때만 묻는다. 보정이 없는 모델이면 칸이 숨은 채로 둔다
  state.baseTier = meta.baseTier ?? "SILVER";
  state.tier = state.iron ? "IRON" : state.baseTier;
  document.getElementById("irontier").hidden = !meta.ironOnly;
  document.getElementById("iron").checked = state.iron;
  const metaBox = document.getElementById("meta");
  metaBox.innerHTML = meta.statusShort ?? meta.status;
  metaBox.title = meta.status.replace(/<br>/g, " · ").replace(/<[^>]+>/g, "");
  state.posGames = meta.positionGames || {};
  state.posTotals = ROLES.map((_, p) =>
    Object.values(state.posGames).reduce((sum, g) => sum + (g[p] || 0), 0));
  // 내 기록 — 없으면 칸이 숨은 채로 둔다
  if(meta.me){
    document.getElementById("openme").hidden = false;
    loadGoal(); setInterval(loadGoal, 5 * 60 * 1000);       // 내 기록을 갱신하면 오늘 판 결과가 따라온다
    try{
      state.mePool = (await fetch(`/api/me/pool?lang=${LANG}`).then(r=>r.json())).pool || {};
    }catch{ state.mePool = {}; }
    if(!state.poolStored && Object.keys(state.mePool).length){   // 처음 한 번만 — 손으로 만든 풀은 건드리지 않는다
      for(const r of ROLES) state.pool[r.key] = [...(state.mePool[r.key] ?? [])];
      savePool();
    }
  }
  goMine();
  renderHeader(); renderBoard(); renderGrid(); refresh();
  voiceInit();
  document.getElementById("q").focus();
  pollLcu();
})();
</script>
