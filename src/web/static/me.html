<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickNote</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<script src="/static/i18n.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#141a23; --panel2:#1b232f; --line:#2a3441;
    --text:#e6edf3; --dim:#8b98a8; --faint:#5a6673;
    --gold:#c8aa6e; --good:#4ade80; --bad:#f87171; --rec:#7cc4e0;
    --win:#3f8bee; --loss:#d96c30; --ring:#333c49; --ring-strong:#66717f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{display:flex;align-items:center;gap:14px;padding:11px 20px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap}
  h1.sub-title{color:var(--dim);font-weight:500;padding-left:14px;border-left:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:7px;color:var(--text);text-decoration:none;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;margin:0}
  .logo img{width:20px;height:20px;display:block}
  .logo em{font-style:normal;color:var(--gold)}
  header .id{color:var(--dim);font-size:13px;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* 계정 이름이 길어도 머리 줄을 한 줄로 */
  @media (min-width:1000px){header{flex-wrap:nowrap} header > :not(.id){flex-shrink:0}}
  header .back{margin-left:auto;border:1px solid var(--line);border-radius:7px;padding:5px 11px;
    color:var(--dim);font-size:13px;text-decoration:none;white-space:nowrap}
  header .back:hover{color:var(--text);border-color:var(--faint)}
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;
    grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  .wide{grid-column:1/-1}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
  section h2{font-size:13px;margin:0 0 2px;font-weight:650}
  section .sub{color:var(--faint);font-size:11.5px;margin:0 0 10px}

  /* 맨 위 숫자 */
  .stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
  @media (max-width:640px){.stats{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}}
  .stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
  .stat .k{color:var(--faint);font-size:11.5px}
  .stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat .s{color:var(--dim);font-size:11.5px}
  .explain{color:var(--dim);font-size:12px;margin-top:12px;line-height:1.65}
  .explain b{color:var(--text);font-weight:600}

  /* 표 */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{color:var(--faint);font-weight:500;font-size:11.5px;text-align:right;padding:4px 8px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px 8px;text-align:right;border-bottom:1px solid #1e2631;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr.thin td{opacity:.5}
  tr.rest td{color:var(--faint);font-size:12px}
  .champ{display:flex;align-items:center;gap:8px}
  .champ img{width:26px;height:26px;border-radius:6px;background:var(--panel2);flex:0 0 26px}
  .champ small{color:var(--faint);font-size:11px}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  td.diffcell{width:150px}
  .diff{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .diff .track{position:relative;width:80px;height:7px;background:#1f2733;border-radius:2px;flex:0 0 80px}
  .diff .track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
  .diff .seg{position:absolute;top:0;height:100%;border-radius:2px}
  .diff .seg.pos{background:var(--good)} .diff .seg.neg{background:var(--bad)}
  .diff span{width:44px;text-align:right}
  @media (max-width:640px){td.diffcell{width:auto} .diff .track{display:none}}
  section:not(.wide):has(td.kda) .diff .track{width:40px;flex-basis:40px}   /* 반쪽 표에 KDA가 들어가면 막대를 줄인다 */
  td.kda b{font-weight:600} td.kda small{display:block;color:var(--faint);font-size:11px;margin-top:1px}
  @media (max-width:640px){td.kda small+small{display:none} th,td{padding-left:5px;padding-right:5px}}   /* 좁은 화면에서는 합을 빼고 칸을 좁힌다 */

  /* 사이드 · 챔피언 풀 */
  .sides{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:6px}
  .sides .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .sides .k{font-size:12px;font-weight:600}
  .sides .r{text-align:right}
  .blue{color:#5b8def} .red{color:#e0485a}
  .sides .mid{text-align:center;color:var(--dim);font-size:12px;padding-bottom:6px}
  .sides .mid b{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:6px;background:var(--panel2);color:var(--text);font-weight:600}
  .wrbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 14px;background:var(--panel2)}
  .wrbar i{display:block}
  .bars{display:grid;gap:7px;font-size:12.5px}
  .bars .b{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
  .bars .b > span:first-child{min-width:44px}
  table.sidetbl th{white-space:normal;vertical-align:bottom}
  table.sidetbl td.diffcell{width:auto}
  table.sidetbl th,table.sidetbl td{padding-left:6px;padding-right:6px}
  .bars .b > span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
  .track2{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden}
  .track2 i{display:block;height:100%;border-radius:4px}
  .poolnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .pooltbl td .tops{display:flex;gap:3px;justify-content:flex-end}
  .pooltbl td .tops img{width:22px;height:22px;border-radius:5px;background:var(--panel2)}

  /* 챔피언 줄 펼치기 — 그 챔피언으로 만난 상대 */
  tr.champrow{cursor:pointer}
  tr.champrow:hover td{background:#18202b}
  tr.champrow:focus-visible{outline:2px solid var(--win);outline-offset:-2px}
  .caret{display:inline-block;width:12px;color:var(--faint);font-size:10px;transition:transform .15s}
  tr.champrow[aria-expanded="true"] .caret{transform:rotate(90deg)}
  tr.foes > td{padding:4px 8px 12px 28px;background:#10151d;white-space:normal}
  tr.foes table td,tr.foes table th{padding:4px 7px;font-size:12.5px}
  tr.foes .champ img{width:22px;height:22px;flex-basis:22px}
  tr.foes .note{color:var(--faint);font-size:11.5px;margin:8px 0 0}
  td.lead{width:58px}
  td.lead.na{color:var(--faint)}

  /* 티어 그래프 */
  .rankcard{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;background:var(--panel2);border-radius:10px;padding:12px 14px;margin:6px 0 12px}
  .tierbadge{font-weight:700;font-size:17px;color:#0a0e14;background:var(--tc);border-radius:7px;padding:2px 10px}
  .rankcard .lp{font-size:17px;color:var(--dim);font-variant-numeric:tabular-nums}
  .rankcard .wr{font-size:15px}
  .rankcard .wr b{font-size:19px;font-weight:700}
  .rankcard .when{flex-basis:100%;color:var(--faint);font-size:11.5px}
  .seg button small{color:var(--faint);font-weight:500;margin-left:3px}
  .seg button[data-season][aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--sc)}
  .seg button:disabled{color:var(--faint);cursor:not-allowed}
  .tg-cmp{font-size:12.5px;color:var(--dim);margin:2px 0 6px}
  .tg-cmp b{color:var(--text)}
  .tg-wrap{position:relative}
  .tg-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
  .tg-wrap svg text{font:11px "Pretendard","Malgun Gothic",system-ui,sans-serif;fill:var(--faint)}
  .tg-wrap svg text.major{fill:var(--dim);font-weight:600}
  .tg-tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12px;line-height:1.6;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:5}

  /* 한눈에 */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .tile{background:var(--panel2);border-radius:10px;padding:12px 10px;text-align:center;min-width:0}
  .tile .tv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .tile .tn{font-size:12.5px;font-weight:600;margin-top:4px}
  .tile .tp{color:var(--dim);font-size:12px;margin-top:1px}
  .tile .ts{color:var(--faint);font-size:10.5px;margin-top:3px;line-height:1.4}
  .tile.good{background:linear-gradient(160deg,#1c2a3f,#1b232f)}
  .tile.good .tv{color:var(--rec)}
  .tile.bad{background:linear-gradient(160deg,#33222a,#1b232f)}
  .tile.bad .tv{color:#f19a9a}
  @media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .mindtbl td small{display:block;color:var(--faint);font-size:11px;white-space:normal}
  .mindtbl td:first-child{white-space:normal}

  /* 시간대별 격차 */
  .ccharts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  @media (max-width:860px){.ccharts{grid-template-columns:minmax(0,1fr)}}
  .cchart{background:var(--panel2);border-radius:10px;padding:10px 10px 4px;min-width:0}
  .cchart h3{font-size:12.5px;font-weight:600;margin:0 0 4px}
  .cchart svg{display:block;width:100%;height:auto}
  .cchart svg text{font:10.5px "Pretendard","Malgun Gothic",system-ui,sans-serif;fill:var(--faint)}

  /* 최근 20판 · 탭 */
  nav.tabs{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:3px}
  nav.tabs a{font-size:13px;font-weight:600;color:var(--dim);text-decoration:none;padding:4px 12px;border-radius:6px}
  nav.tabs a[aria-current="page"]{background:var(--line);color:var(--text)}
  nav.tabs a:focus-visible{outline:2px solid var(--win);outline-offset:2px}
  nav.tabs{flex-wrap:wrap}
  header .tiersel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:inherit;font-size:13px}
  /* 탭 — 지금 탭이 아닌 섹션은 숨긴다. data-tab 이 없는 섹션(맨 아래 안내)은 어느 탭에나 */
  main[data-tab] section[data-tab]{display:none}
  main[data-tab="summary"] section[data-tab~="summary"], main[data-tab="trend"] section[data-tab~="trend"],
  main[data-tab="skill"] section[data-tab~="skill"], main[data-tab="champ"] section[data-tab~="champ"],
  main[data-tab="opp"] section[data-tab~="opp"]{display:block}
  .growtbl td small,.rtable td small{display:block;color:var(--faint);font-size:11px}
  .growtbl td:first-child,.mixtbl td:first-child{color:var(--dim)}
  .mixtbl td{white-space:normal}
  tr.rrow{cursor:pointer}
  tr.rrow:hover td{background:#18202b}
  tr.rrow.w td:first-child{box-shadow:inset 3px 0 0 var(--win)}
  tr.rrow.l td:first-child{box-shadow:inset 3px 0 0 var(--loss)}
  tr.rrow:focus-visible{outline:2px solid var(--win);outline-offset:-2px}
  tr.rdetail > td{background:#10151d;padding:10px;white-space:normal}
  .tile.mini{padding:8px 6px}
  .tile.mini .tv{font-size:16px}
  .tile.mini .tn{font-size:11.5px}
  .tile.mini .tp{font-size:11px}

  /* 달별 */
  .months svg{display:block;width:100%;height:auto}
  .months text{font:10.5px "Pretendard","Malgun Gothic",system-ui,sans-serif;fill:var(--faint)}
  .months .wr{font-weight:600}
  .foot{color:var(--faint);font-size:11.5px;line-height:1.7}
  .foot code{color:var(--dim);background:var(--panel2);padding:1px 5px;border-radius:4px}
  .empty{color:var(--faint);padding:40px 16px;text-align:center;grid-column:1/-1}

  /* 승패 육각형 */
  .hexbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:4px 0 12px}
  .seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px}
  .seg button{font:inherit;font-weight:600;font-size:13px;color:var(--dim);background:transparent;border:0;
    border-radius:6px;padding:5px 12px;cursor:pointer;min-height:34px}
  .seg button[aria-pressed="true"]{background:var(--line);color:var(--text)}
  .hexbar select{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
  .seg button:focus-visible,.hexbar select:focus-visible{outline:2px solid var(--win);outline-offset:2px}
  .hexbar select:disabled{color:var(--faint);cursor:not-allowed}
  .hexbody{display:grid;gap:16px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  @media (max-width:760px){.hexbody{grid-template-columns:minmax(0,1fr)}}
  .hexbody svg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto;overflow:visible}
  .hexbody svg text{font:600 13px "Pretendard","Malgun Gothic",system-ui,sans-serif;fill:var(--text)}
  .hexbody svg text.nodata{fill:var(--faint);font-weight:400}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--dim);margin-bottom:4px}
  .legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
  .legend i.dash{border-top-style:dashed}
  .gaps{display:grid;gap:3px;font-size:13px}
  .gaps h3{font-size:12px;color:var(--dim);font-weight:600;margin:6px 0 2px}
  .gaps div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1e2631;padding:4px 0}
  .gaps div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
  .gaps .noise{color:var(--faint)}
  .gaps .wobble{display:block;border:0;color:var(--dim);font-size:12px;margin-top:10px;line-height:1.6}
  .wobble b{color:var(--gold);font-weight:600}
  .locked{display:grid;place-items:center;text-align:center;min-height:160px;color:var(--dim);
    border:1px dashed var(--ring-strong);border-radius:8px;padding:16px}
  td .base{color:var(--faint)}
  .hextable th{white-space:normal;vertical-align:bottom}
  .stylebody{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:center}
  @media (max-width:760px){.stylebody{grid-template-columns:minmax(0,1fr)}}
  .growtbl td.base{color:var(--faint)}     /* 폰에서 티어 평균 칸이 밖으로 밀리지 않게 */
  @media (max-width:520px){.hextable th,.hextable td{padding:5px 4px}}

  /* 언어 전환 — 오른쪽 아래 구석, 머리줄 단추와 겹치지 않게 */
  #lang-toggle{position:fixed;right:14px;bottom:14px;z-index:50;font:inherit;font-size:12px;font-weight:600;
    color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 11px;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #lang-toggle:hover{color:var(--text);border-color:var(--faint)}
  #lang-toggle:focus-visible{outline:2px solid var(--win);outline-offset:2px}
  body{padding-bottom:48px}
</style>
</head>
<body>
<header>
  <a class="logo" href="/" title="PickNote"><img src="/static/logo.svg" alt=""><span>Pick<em>Note</em></span></a>
  <h1 class="sub-title" data-en="My record">내 기록</h1>
  <nav class="tabs" aria-label="보기"><a href="#summary" data-view="summary">요약</a><a href="#trend" data-view="trend">추이</a><a href="#skill" data-view="skill">실력</a><a href="#champ" data-view="champ">챔피언</a><a href="#opp" data-view="opp">상대·팀</a><a href="#recent" data-view="recent">최근 20판</a></nav>
  <select class="tiersel" id="tierSel" aria-label="기준 티어"></select>
  <span class="id" id="rid"></span>
  <a class="back" href="/" data-en="Back to picks">추천 화면으로</a>
</header>
<main id="main"><div class="empty" data-en="Loading…">불러오는 중…</div></main>

<script>
const POS_KO = {TOP:L("탑", "Top"), JUNGLE:L("정글", "Jungle"), MIDDLE:L("미드", "Mid"), BOTTOM:L("원딜", "Bot"), UTILITY:L("서폿", "Support")};
const THIN = 10;          // 이보다 적은 판은 흐리게 — 10판짜리 70%를 믿게 만들면 안 된다
const PP = L("%p", "pp");
let D = null;
document.title = L("내 기록", "My record");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null ? "—" : `${v.toFixed(1)}%`;
const sign = v => v == null ? "" : (v > 0 ? "pos" : v < 0 ? "neg" : "");
const img = id => {
  const c = D.champions_meta[id];
  return c ? `https://ddragon.leagueoflegends.com/cdn/${D.version}/img/champion/${c.image}.png` : "";
};
const nameOf = id => D.champions_meta[id] ? champName(D.champions_meta[id]) : id;

/** 내 몫 막대 — ±20%p를 끝으로 */
function diffCell(v){
  if(v == null) return `<td class="diffcell">—</td>`;
  const w = Math.min(Math.abs(v), 20) / 20 * 50;
  const left = v >= 0 ? 50 : 50 - w;
  return `<td class="diffcell"><div class="diff">
    <div class="track"><i class="seg ${sign(v)}" style="left:${left}%;width:${w}%"></i></div>
    <span class="${sign(v)}">${v > 0 ? "+" : ""}${v.toFixed(1)}</span></div></td>`;
}
/** KDA — (킬+어시) ÷ 데스, 데스가 0이면 Perfect. 합 [k, d, a]과 판 수로 평균도 */
const kdaRatio = ([k, d, a]) => d ? ((k + a) / d).toFixed(2) : "Perfect";
const kdaAvg = ([k, d, a], n) => [k, d, a].map(x => (x / n).toFixed(1)).join(" / ");
const kdaCell = r => `<td class="kda"><b>KDA ${kdaRatio(r.kda)}</b><small>${L("평균", "Avg")} ${kdaAvg(r.kda, r.games)}</small><small>${L("합", "Total")} ${r.kda.join(" / ")}</small></td>`;
const cols = (r, kda) => `<td>${r.games}</td><td class="${r.games >= THIN ? sign(r.winrate - 50) : ""}">${pct(r.winrate)}</td>`
  + (kda ? kdaCell(r) : "") + (D.hasModel ? `<td>${pct(r.expected)}</td>${diffCell(r.diff)}` : "");
const head = (first, kda) => `<tr><th>${first}</th><th>${L("판", "Games")}</th><th>${L("승률", "Win rate")}</th>` + (kda ? `<th>KDA</th>` : "")
  + (D.hasModel ? `<th>${L("조합 기대", "Draft exp.")}</th><th>${L("내 몫 (%p)", "Your edge (pp)")}</th>` : "") + `</tr>`;
const thin = r => r.games < THIN ? "thin" : "";

function champCell(id, sub){
  return `<div class="champ"><img src="${img(id)}" alt="" loading="lazy">
    <span>${esc(nameOf(id))}${sub ? ` <small>${sub}</small>` : ""}</span></div>`;
}

function monthsSVG(months){
  const W = 1000, H = 150, top = 22, base = 120, gap = 6;
  const max = Math.max(...months.map(m => m.games));
  const bw = (W - gap * (months.length - 1)) / months.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("달별 판 수와 승률", "Games and win rate by month")}">` + months.map((m, i) => {
    const x = i * (bw + gap), h = (base - top) * m.games / max;
    const col = m.games < THIN ? "var(--faint)" : m.winrate >= 50 ? "var(--good)" : "var(--bad)";
    return `<rect x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="3" fill="var(--panel2)" stroke="var(--line)"/>
      <text class="wr" x="${x + bw / 2}" y="${base - h - 6}" text-anchor="middle" style="fill:${col}">${Math.round(m.winrate)}%</text>
      <text x="${x + bw / 2}" y="${base + 14}" text-anchor="middle">${L(`${m.games}판`, `${m.games}g`)}</text>
      <text x="${x + bw / 2}" y="${base + 27}" text-anchor="middle">${m.month.slice(2).replace("-", ".")}</text>`;
  }).join("") + `</svg>`;
}

      `<b>Draft expectation</b> is your team's win rate as the model sees it from the ten champions alone — "at average skill".
      Subtract it from your actual win rate and you get <b>your edge, with the draft factored out</b>.
      Rows with fewer than ${THIN} games are faded — chance alone easily swings them ±15pp.`)}</div>` : ""}
  </section>`);

  html.push(`<section class="wide" id="form" data-tab="summary" hidden></section>`);

  // 계정이 둘 이상일 때만 — 계정마다 붙는 상대 수준이 다를 수 있어 따로도 본다

    <div class="tw"><table>${head(L("계정", "Account"), true)}${D.accounts.map(r =>
      `<tr class="${thin(r)}"><td>${esc(r.riotId)}</td>${cols(r, true)}</tr>`).join("")}</table></div></section>`);

  html.push(`<section class="wide" id="tier" data-tab="trend" hidden></section>`);
  html.push(`<section class="wide" id="hex" data-tab="skill" hidden></section>`);
  html.push(`<section class="wide" id="curve" data-tab="skill" hidden></section>`);

    </table></div></section>`);

  html.push(`<section class="wide months" data-tab="trend"><h2>${L("달별", "By month")}</h2><div class="sub">${L(`막대는 판 수, 위 숫자는 그달 승률 (${THIN}판 미만은 회색)`, `Bars are games played, numbers above are that month's win rate (gray under ${THIN} games)`)}</div>
    ${monthsSVG(D.months)}</section>`);

  html.push(`<section data-tab="opp" data-sec="lane"><h2>${L("자주 만난 상대 라이너", "Frequent lane opponents")}</h2><div class="sub">${L("같은 포지션의 상대 챔피언 · 5판 이상", "Enemy champion in your position · 5+ games")}</div>
    ${D.lane.length ? `<div class="tw"><table>${head(L("상대", "Opponent"))}${D.lane.map(r =>
      `<tr class="${thin(r)}"><td>${champCell(r.championId)}</td>${cols(r)}</tr>`).join("")}</table></div>`
      : `<div class="sub">${L("아직 5판 넘게 만난 상대가 없습니다", "No opponent faced 5+ times yet")}</div>`}</section>`);

  html.push(`<section data-tab="opp" data-sec="mates"><h2>${L("같이 한 사람", "Teammates")}</h2><div class="sub">${L("같은 팀으로 3판 이상 — 이름은 저장하지 않아 번호로만 보입니다", "3+ games on the same team — names aren't stored, so they show as numbers")}</div>
    ${D.mates.length ? `<div class="tw"><table>${head("")}${D.mates.map(r =>
      `<tr class="${thin(r)}"><td>${r.label}</td>${cols(r)}</tr>`).join("")}</table></div>`
      : `<div class="sub">${L("없습니다", "None")}</div>`}</section>`);

  html.push(`<section class="wide foot">${L(`
    새 경기는 <code>4_MyRecord.cmd</code>로 받습니다 — 요청 몇 번이라 수집기와 같이 돌아도 됩니다.<br>
    추천 화면의 승률 숫자에는 이 기록을 섞지 않았습니다. 지난 판들로 다음 판을 더 잘 맞히는지 재 봤는데
    아직 판이 적어 가려지지 않았습니다 — 기록은 추천 줄에 <b>내 기록 N판 · W%</b>로만 붙습니다.`, `
    New games are fetched with <code>4_MyRecord.cmd</code> — it's only a few requests, so it can run alongside the collector.<br>
    This record is not mixed into the win rates on the pick screen. We tested whether past games predict the next one better,
    but there aren't enough games yet to tell — the record only appears on recommendation rows as <b>My record N games · W%</b>.`)}
  </section>`);

  const mainEl = document.getElementById("main");
  mainEl.innerHTML = html.join("");
  const foot = mainEl.querySelector("section.foot");
  for(const sec of ["champs", "pool", "pos", "lane", "mates", "sides", "accounts"]){
    const el = mainEl.querySelector(`[data-sec="${sec}"]`);
    if(el) mainEl.insertBefore(el, foot);
  }
  const toggle = tr => {
    const open = tr.getAttribute("aria-expanded") === "true";
    tr.setAttribute("aria-expanded", String(!open));
    if(open){ if(tr.nextElementSibling?.classList.contains("foes")) tr.nextElementSibling.remove(); return; }
    tr.insertAdjacentHTML("afterend", foesRow(D.champions[+tr.dataset.i]));
  };
  document.querySelectorAll("#champTable tr.champrow").forEach(tr => {
    tr.onclick = () => toggle(tr);
    tr.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(tr); } };
  });
}

// ---------------------------------------------------------------- 사이드
function sidesSection(){
  const by = Object.fromEntries((D.sides || []).map(r => [r.side, r]));
  const b = by[100] || {games:0, winrate:null, kda:[0,0,0]}, r = by[200] || {games:0, winrate:null, kda:[0,0,0]};
  const n = b.games + r.games;
  if(!n) return "";
  const BLUE = L("블루", "Blue"), RED = L("레드", "Red");
  const gap = b.winrate != null && r.winrate != null ? b.winrate - r.winrate : null;
  const share = x => x.games / n * 100;
  const lead = gap == null ? "—" : Math.abs(gap) < 0.05 ? L("같음", "Even") : `${gap > 0 ? BLUE : RED} +${Math.abs(gap).toFixed(1)}${PP}`;
  const bw = b.winrate ?? 0, rw = r.winrate ?? 0;
  const noise = Math.round(98 * Math.sqrt(1 / Math.max(b.games, 1) + 1 / Math.max(r.games, 1)));
  const games = x => L(`${x.games}판`, `${x.games} games`);
  return `<section data-tab="opp" data-sec="sides"><h2>${L("사이드", "Side")}</h2><div class="sub">${L("사이드는 고를 수 없어 운에 가깝습니다", "You can't pick your side, so this is mostly luck")}</div>
    <div class="sides">
      <div><div class="k blue">${BLUE}</div><div class="v">${pct(b.winrate)}</div></div>
      <div class="mid">${L("승률", "Win rate")}<br><b>${lead}</b></div>
      <div class="r"><div class="k red">${RED}</div><div class="v">${pct(r.winrate)}</div></div>
    </div>
    <div class="wrbar" aria-hidden="true"><i style="width:${bw + rw ? bw / (bw + rw) * 100 : 50}%;background:#5b8def"></i><i style="flex:1;background:#e0485a"></i></div>
    <div class="bars">
      <div class="sub" style="margin:0">${L("걸린 판", "Games on each side")}</div>
      <div class="b"><span class="blue">${BLUE}</span><div class="track2"><i style="width:${share(b)}%;background:#5b8def"></i></div><span>${games(b)} · ${share(b).toFixed(1)}%</span></div>
      <div class="b"><span class="red">${RED}</span><div class="track2"><i style="width:${share(r)}%;background:#e0485a"></i></div><span>${games(r)} · ${share(r).toFixed(1)}%</span></div>
    </div>
    <div class="tw" style="margin-top:12px"><table class="sidetbl">${head(L("사이드", "Side"), true)}
      <tr class="${thin(b)}"><td class="blue">${BLUE}</td>${cols(b, true)}</tr>
      <tr class="${thin(r)}"><td class="red">${RED}</td>${cols(r, true)}</tr></table></div>
    ${gap != null ? `<div class="explain">${L(`이 판 수면 두 사이드 승률 차이는 우연으로도 ±${noise}%p쯤 납니다.`, `With this many games, the gap between sides can be ±${noise}pp from luck alone.`)}${D.hasModel ? L(" 조합 기대에는 사이드 이점이 들어 있어서, <b>내 몫</b> 칸은 사이드 운을 덜어 낸 값입니다.", " The draft expectation already includes the side advantage, so <b>Your edge</b> has side luck taken out.") : ""}</div>` : ""}
  </section>`;
}

// ---------------------------------------------------------------- 챔피언 풀
function poolSection(){
  const P = D.pool;
  if(!P?.games) return "";
  const total = Object.keys(D.champions_meta || {}).length;
  const bar = (label, v) => `<div class="b"><span>${label}</span><div class="track2"><i style="width:${v ?? 0}%;background:var(--win)"></i></div><span>${pct(v)}</span></div>`;
  const tops = r => `<div class="tops">${r.top.map(t => `<img src="${img(t.championId)}" alt="${esc(nameOf(t.championId))}" title="${esc(nameOf(t.championId))} ${L(`${t.games}판 · 승률`, `${t.games} games · win rate`)} ${pct(t.winrate)}" loading="lazy">`).join("")}</div>`;
  const MAIN = L("주력", "Main"), TOP3 = L("상위 3", "Top 3");
  return `<section data-tab="champ" data-sec="pool"><h2>${L("챔피언 풀", "Champion pool")}</h2><div class="sub">${L("한 챔피언에 얼마나 기대나 — 판 수 기준", "How much you lean on a few champions — by games played")}</div>
    <div class="poolnums">
      <div class="stat"><div class="k">${L("해 본 챔피언", "Champions played")}</div><div class="v">${P.champs}${total ? ` <small style="font-size:13px;color:var(--faint);font-weight:500">/ ${total}</small>` : ""}</div></div>
      <div class="stat"><div class="k">${L("상위 3 의존도", "Top 3 focus")}</div><div class="v">${pct(P.top3)}</div><div class="s">${L("많이 한 챔피언 셋의 판 비율", "Share of games on your 3 most played")}</div></div>
    </div>
    <div class="bars">
      ${bar(MAIN, P.top1)}${bar(TOP3, P.top3)}${bar(L("상위 5", "Top 5"), P.top5)}
    </div>
    <div class="tw" style="margin-top:12px"><table class="pooltbl">
      <tr><th>${L("자리", "Position")}</th><th>${L("판", "Games")}</th><th>${L("챔피언", "Champs")}</th><th title="${L("그 자리에서 가장 많이 한 챔피언의 판 비율", "Share of games on your most played champion in that position")}">${MAIN}</th><th>${TOP3}</th><th>${L("많이 한 순", "Most played")}</th></tr>
      ${P.positions.map(r => `<tr class="${thin(r)}"><td>${POS_KO[r.position] ?? r.position}</td><td>${r.games}</td><td>${r.champs}</td>
        <td>${pct(r.top1)}</td><td>${pct(r.top3)}</td><td>${tops(r)}</td></tr>`).join("")}
    </table></div>
    <div class="explain">${L("주력 의존도가 높을수록 그 챔피언이 밴되거나 뺏겼을 때 타격이 큽니다. 아이콘에 마우스를 올리면 판 수와 승률이 보입니다.",
      "The higher your main focus, the more it hurts when that champion is banned or taken. Hover an icon for its games and win rate.")}</div>
  </section>`;
}

// ---------------------------------------------------------------- 챔피언 줄 펼치기 — 그 챔피언으로 만난 상대 라이너
const FOE_AXES = [{k:"gold15", n:L("라인전", "Laning"), u:L("15분 골드", "Gold at 15")}, {k:"gold", n:L("골드", "Gold"), u:L("분당 골드", "Gold per min")},
                  {k:"dmg", n:L("딜", "Damage"), u:L("분당 챔피언 딜", "Champion damage per min")}, {k:"kp", n:L("킬 관여", "Kill part."), u:L("킬 관여", "Kill participation")},
                  {k:"deaths", n:L("생존", "Survival"), u:L("데스 (적을수록 앞섬)", "Deaths (fewer is ahead)")}, {k:"vision", n:L("시야", "Vision"), u:L("분당 시야 점수", "Vision score per min")}];
function foesRow(c){
  const F = c.foes, span = 4 + (D.hasModel ? 2 : 0), lo = D.foeMin - 1;
  const others = k => L(`각 1~${lo}판`, `1–${lo} games each`);
  if(!F.rows.length) return `<tr class="foes"><td colspan="${span}"><div class="note">${L(`${D.foeMin}판 넘게 만난 상대 라이너가 아직 없습니다`, `No lane opponent faced ${D.foeMin}+ times yet`)}${F.rest.games ? L(` (만난 상대 ${F.rest.champions}명, ${others()})`, ` (${F.rest.champions} opponents, ${others()})`) : ""}.</div></td></tr>`;
  const leadCell = (r, a) => {
    const v = r.lead?.[a.k];
    if(v == null) return `<td class="lead na" title="${r.lead ? L("15분 타임라인이 없습니다", "No 15-minute timeline") : L(`솔로랭크 15분 넘은 판이 ${D.foeDetailMin}판 미만`, `Fewer than ${D.foeDetailMin} solo queue games over 15 min`)}">—</td>`;
    const cls = Math.abs(v - 50) < 98 / Math.sqrt(r.duelGames) ? "" : sign(v - 50);
    return `<td class="lead ${cls}" title="${a.u}: ${L(`맞은편 ${esc(nameOf(r.championId))}보다 앞선 판 ${Math.round(v)}% (${r.duelGames}판)`, `ahead of ${esc(nameOf(r.championId))} in ${Math.round(v)}% of games (${r.duelGames})`)}">${Math.round(v)}%</td>`;
  };
  const rows = F.rows.map(r => `<tr class="${thin(r)}"><td>${champCell(r.championId)}</td><td>${r.games}</td>
    <td class="${r.games >= THIN ? sign(r.winrate - 50) : ""}">${pct(r.winrate)}</td><td class="kda"><b>${kdaRatio(r.kda)}</b><small>${kdaAvg(r.kda, r.games)}</small></td>
    ${FOE_AXES.map(a => leadCell(r, a)).join("")}</tr>`).join("");
  const rest = F.rest.games ? `<tr class="rest"><td>${L(`나머지 ${F.rest.champions}명 (${others()})`, `${F.rest.champions} others (${others()})`)}</td><td>${F.rest.games}</td><td>${pct(F.rest.winrate)}</td><td class="kda"><b>${kdaRatio(F.rest.kda)}</b></td>${FOE_AXES.map(() => "<td></td>").join("")}</tr>` : "";
  const w = Math.round(98 / Math.sqrt(D.foeDetailMin));
  return `<tr class="foes"><td colspan="${span}"><div class="tw"><table>
      <tr><th>${L("상대", "vs")} ${POS_KO[c.position] ?? ""}</th><th>${L("판", "Games")}</th><th>${L("승률", "Win rate")}</th><th>KDA</th>${FOE_AXES.map(a => `<th title="${a.u} — ${L("맞은편보다 앞선 판의 비율", "share of games ahead of your lane opponent")}">${a.n}</th>`).join("")}</tr>
      ${rows}${rest}</table></div>
    <div class="note">${L(`${D.foeMin}판 이상 만난 상대만 따로 셉니다. 오른쪽 여섯 칸은 그 상대보다 앞선 판의 비율(50%가 동률)이고,
      솔로랭크 15분 넘은 판이 ${D.foeDetailMin}판 이상일 때만 보입니다. 판이 적어 크게 흔들리므로, 우연 폭(${D.foeDetailMin}판이면 ±${w}%p)을 넘을 때만 색을 칠합니다.`,
      `Only opponents faced ${D.foeMin}+ times get their own row. The six columns on the right are the share of games you were ahead of that opponent (50% = even),
      shown once there are ${D.foeDetailMin}+ solo queue games over 15 minutes. Samples are small, so a cell is colored only when it's beyond chance (±${w}pp at ${D.foeDetailMin} games).`)}</div></td></tr>`;
}


// ---------------------------------------------------------------- 한눈에 (지표 칸)
// 기준은 승패 육각형과 같은 티어 표본(benchmark.json의 form). 판마다 같은 티어·같은 자리 사람 중 몇 등인지 재고 그 평균을 "상위 N%"로 쓴다.
let FM = null;
const fm = {pos: ""};
const MIND = [

function rateVs(pick, hit, baseKey, good){
  const T = FM.base[hx.tier] || FM.base.SILVER;
  const n = pick.length;
  const mine = n ? pick.reduce((s, g) => s + hit(g), 0) / n * 100 : null;
  const base = avg(pick.map(g => T[g.pos]?.[baseKey]?.[0]).filter(x => x != null));

  const hit = g => m.k === "lost" ? g.win : m.k === "won" ? 1 - g.win : (g.win && g.lane > 50 && g.contrib >= 1 ? 1 : 0);

/** 판 하나에서 그 값이 같은 티어·자리 표본의 몇 %보다 높은가 (0~100). 적을수록 좋은 지표는 뒤집는다 */
function pctOf(g, k){

  if(!q || v == null) return null;
  // 분위수 21개 사이를 잇는다. 같은 값이 여러 분위에 걸치면(솔로킬 0, 데스 0처럼) 그 구간의 가운데로

const TIERS = ["IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM", "EMERALD", "DIAMOND"];

                    DIAMOND:"#7a8cf0", MASTER:"#b46be0", GRANDMASTER:"#e05c5c", CHALLENGER:"#f0c75a"};
const DIVS = ["IV", "III", "II", "I"], DIV_NUM = {IV:4, III:3, II:2, I:1};

const seasonYear = s => `${2010 + +s}`;           // 패치 16 = 2026 시즌
const two = n => String(n).padStart(2, "0");
const md = t => { const d = new Date(t); return `${two(d.getMonth() + 1)}/${two(d.getDate())}`; };
const ymd = t => { const d = new Date(t); return `${String(d.getFullYear()).slice(2)}.${two(d.getMonth() + 1)}.${two(d.getDate())}`; };
/** 티어를 한 줄 숫자로 — 아이언 IV 0LP = 0, 디비전마다 100, 마스터부터는 2800 + LP */
const tierValue = (tier, div, lp) => TIERS.includes(tier) ? TIERS.indexOf(tier) * 400 + DIVS.indexOf(div) * 100 + lp : 2800 + lp;
function tierLabel(v, withLp = true){
  v = Math.max(0, Math.round(v));
  if(v >= 2800) return `${L("마스터+", "Master+")} ${v - 2800}LP`;
  const t = TIERS[Math.floor(v / 400)], d = DIVS[Math.floor(v % 400 / 100)];
  return `${TIER_NAME[t]} ${DIV_NUM[d]}` + (withLp ? ` ${v % 100}LP` : "");
}
let TG = null;
const tg = {acct: "", seasons: null, y: "tier"};

function tierSeries(acct, season){
  const gs = TG.games.filter(g => g.a === acct && g.s === season).sort((a, b) => a.t - b.t);
  let net = 0, w = 0;
  const pts = gs.map((g, i) => { net += g.w ? 1 : -1; w += g.w; return {i: i + 1, t: g.t, w: g.w, net, wins: w}; });
  // 이 시즌 안에 찍은 가장 늦은 랭크 — 그 판 수에서 진짜 값이고, 앞뒤는 판마다 ±lpPerGame
  const snap = gs.length ? TG.snaps.filter(r => r.a === acct && r.t >= gs[0].t).at(-1) : null;
  if(snap){
    const k = pts.filter(p => p.t <= snap.t).length;           // 찍기 전까지 한 판 수
    const base = tierValue(snap.tier, snap.div, snap.lp), netK = k ? pts[k - 1].net : 0;
    pts.forEach(p => p.v = base + TG.lpPerGame * (p.net - netK));
    snap.at = k;
  }
  return {season, pts, snap, color: ""};
}

function niceStep(range, target = 6){
  const raw = range / target, mag = 10 ** Math.floor(Math.log10(Math.max(raw, 1e-9)));
  return [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw) ?? 10 * mag;
}

/** W는 칸의 실제 폭(px) — 1000으로 그려 줄이면 폰에서 글자가 4px이 된다 */
function tierChart(series, mode, W){
  const narrow = W < 600, H = narrow ? 230 : 320, ML = narrow ? 64 : 92, R = narrow ? 10 : 18, T = 16, B = 40;
  const single = series.length === 1;
  const val = p => mode === "tier" ? p.v : p.net;
  const all = series.flatMap(s => s.pts.map(val));
  let lo = Math.min(...all, mode === "net" ? 0 : Infinity), hi = Math.max(...all, mode === "net" ? 0 : -Infinity);
  const pad = Math.max((hi - lo) * 0.08, mode === "tier" ? 25 : 2);
  lo -= pad; hi += pad;
  const n = Math.max(...series.map(s => s.pts.length));
  const X = i => ML + (n <= 1 ? 0 : (i - 1) / (n - 1) * (W - ML - R));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("티어 그래프", "Rank graph")}">`;
  // 가로 눈금
  if(mode === "tier"){
    const step = hi - lo > 1400 ? 400 : 100;
    for(let v = Math.ceil(lo / step) * step; v <= hi; v += step){
      const major = v % 400 === 0;
      s += `<line x1="${ML}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(${major ? "--ring-strong" : "--ring"})" stroke-width="1"/>`;
      s += `<text x="${ML - 8}" y="${Y(v) + 4}" text-anchor="end"${major ? ' class="major"' : ""}>${tierLabel(v, false)}</text>`;
    }
  }else{
    const step = niceStep(hi - lo);
    for(let v = Math.ceil(lo / step) * step; v <= hi; v += step){
      s += `<line x1="${ML}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(${v === 0 ? "--ring-strong" : "--ring"})" stroke-width="1"/>`;
      s += `<text x="${ML - 8}" y="${Y(v) + 4}" text-anchor="end"${v === 0 ? ' class="major"' : ""}>${v > 0 ? "+" : ""}${v}</text>`;
    }
  }
  // 세로 눈금 — 한 시즌이면 날짜, 여럿이면 몇 판째
  const ticks = Math.min(narrow ? 4 : 8, n);
  for(let k = 0; k < ticks; k++){
    const i = Math.round(1 + k * (n - 1) / Math.max(ticks - 1, 1));
    const lab = single ? md(series[0].pts[i - 1].t) : L(`${i}판`, `#${i}`);
    s += `<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H - B}" stroke="var(--ring)" stroke-width="1" stroke-dasharray="2 4"/>`;
    s += `<text x="${X(i)}" y="${H - B + 18}" text-anchor="${k === 0 && ticks > 1 ? "start" : k === ticks - 1 && ticks > 1 ? "end" : "middle"}">${lab}</text>`;
  }
  // 선
  series.forEach(ser => {
    const line = ser.pts.map(p => `${X(p.i).toFixed(1)},${Y(val(p)).toFixed(1)}`).join(" ");
    if(single && ser.pts.length) s += `<polygon points="${X(1)},${H - B} ${line} ${X(ser.pts.length)},${H - B}" fill="var(${ser.color})" fill-opacity=".10"/>`;
    s += `<polyline points="${line}" fill="none" stroke="var(${ser.color})" stroke-width="${single ? 2.2 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(ser.pts.length <= 60) ser.pts.forEach(p => s += `<circle cx="${X(p.i).toFixed(1)}" cy="${Y(val(p)).toFixed(1)}" r="2.6" fill="var(${ser.color})"/>`);
    // 찍어 둔 진짜 랭크
    if(mode === "tier" && ser.snap && ser.snap.at){
      const p = ser.pts[ser.snap.at - 1];
      s += `<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="6" fill="var(--panel)" stroke="var(--text)" stroke-width="2"/>`;
    }
  });
  s += `<line class="tg-guide" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--dim)" stroke-width="1" visibility="hidden"/>`;
  s += `<rect class="tg-hit" x="${ML}" y="${T}" width="${W - ML - R}" height="${H - T - B}" fill="transparent"/>`;
  return {svg: s + "</svg>", X, n, L: ML, R, W};
}

function renderTier(){

      추정은 실제와 판마다 몇 LP씩 어긋나고(연승·MMR에 따라 한 판 15~30LP), 승급전 보호·강등 보호나 다시하기는 반영하지 않아 찍은 점에서 멀수록 틀립니다.
      시즌을 여러 개 누르면 순승리로 겹쳐 지난 시즌보다 빨리 오르는지 비교합니다.`,
      `Riot's API has no rank or LP history, so PickNote records your rank each time you refresh your record with <code>4_MyRecord.cmd</code> or <code>Update.cmd</code> — the more updates, the more real points.
      The estimate drifts a few LP per game (real gains are 15–30 LP depending on streaks and MMR) and ignores promotion/demotion shields and remakes, so it gets less accurate the further it is from a recorded point.

    tg.seasons = on ? tg.seasons.filter(x => x !== s) : [...tg.seasons, s];

  box.querySelectorAll("[data-y]").forEach(b => b.onclick = () => { tg.y = b.dataset.y; renderTier(); });
  const acct = box.querySelector("#tgAcct");
  if(acct) acct.onchange = e => { tg.acct = e.target.value; tg.seasons = null; renderTier(); };

  // 마우스를 올리면 그 판
  const svg = box.querySelector("svg"), hit = svg.querySelector(".tg-hit"), guide = svg.querySelector(".tg-guide"), tip = box.querySelector(".tg-tip");
  const show = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * chart.W;
    const i = Math.min(chart.n, Math.max(1, Math.round(1 + (x - chart.L) / (chart.W - chart.L - chart.R) * (chart.n - 1))));

let tierW = 0;

// ---------------------------------------------------------------- 시간대별 격차 (맞은편과 CS · 골드 · 경험치, 5분마다)
// 비교선: 챔피언을 고르면 같은 챔피언(다섯 티어 합 차이를 티어·자리 기준에 더함), 자리를 고르면 같은 자리 동티어, 아니면 동티어(내 자리 비율대로).
let CV = null;
const cv = {pos: "", champ: "", mode: "group"};
const CURVE_KEYS = [{k:"cs", n:L("CS 격차", "CS gap")}, {k:"gold", n:L("골드 격차", "Gold gap")}, {k:"xp", n:L("경험치 격차", "XP gap")}];
const CURVE_MIN_N = 5;          // 그 시간까지 간 내 판이 이보다 적으면 점을 찍지 않는다

function curveBase(g, side, k, i){
  const T = (CV.tiers[hx.tier] || CV.tiers.SILVER)?.[g.pos]?.[side];
  const t = T?.[k]?.[i];
  if(t == null) return null;
  if(!cv.champ) return t;
  const c = CV.champs?.[g.pos]?.[String(g.champ)]?.[side]?.[k]?.[i], p = CV.posPooled?.[g.pos]?.[side]?.[k]?.[i];
  return c == null || p == null ? t : t + c - p;
}
/** 시간마다 (그 시간까지 간 판만) 내 평균과 비교선 */
function curveLine(gs, k, side){
  return CV.minutes.map((m, i) => {
    const at = gs.filter(g => g.gaps[k].length > i);
    const mine = at.length >= CURVE_MIN_N ? avg(at.map(g => g.gaps[k][i])) : null;
    const base = at.length ? avg(at.map(g => curveBase(g, side, k, i)).filter(x => x != null)) : null;
    return {m, n: at.length, mine, base};
  });
}
function curveChart(title, unit, series){
  const W = 340, H = 220, ML = 46, R = 12, T = 12, B = 28;
  const vals = series.flatMap(s => s.pts.map(p => p.v)).filter(v => v != null);
  if(!vals.length) return `<div class="cchart"><h3>${title}</h3><div class="locked">${L("자료가 모자랍니다", "Not enough data")}</div></div>`;
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = Math.max((hi - lo) * 0.12, unit === "cs" ? 1 : 30);
  lo -= pad; hi += pad;
  const mins = CV.minutes;
  const X = i => ML + i / (mins.length - 1) * (W - ML - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = niceStep(hi - lo, 5);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">`;
  for(let v = Math.ceil(lo / step) * step; v <= hi; v += step){
    s += `<line x1="${ML}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(${v === 0 ? "--ring-strong" : "--ring"})" stroke-width="1"/>`;
    s += `<text x="${ML - 6}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${Math.abs(step) < 1 ? v.toFixed(1) : Math.round(v)}</text>`;
  }
  mins.forEach((m, i) => s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${L(`${m}분`, `${m}m`)}</text>`);
  series.forEach(ser => {
    const segs = []; let cur = [];
    ser.pts.forEach((p, i) => { if(p.v == null){ if(cur.length) segs.push(cur); cur = []; } else cur.push([X(i), Y(p.v)]); });
    if(cur.length) segs.push(cur);
    segs.forEach(seg => s += `<polyline points="${seg.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ")}" fill="none" stroke="${ser.color}" stroke-width="2.2" stroke-linejoin="round"${ser.dash ? ' stroke-dasharray="5 4"' : ""}/>`);
    ser.pts.forEach((p, i) => { if(p.v == null) return;
      s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${ser.dash ? 2.6 : 3.6}" fill="${ser.color}"><title>${ser.label} · ${L(`${mins[i]}분`, `${mins[i]} min`)} ${p.v > 0 ? "+" : ""}${unit === "cs" ? p.v.toFixed(1) : Math.round(p.v)}${p.n != null ? L(` (${p.n}판)`, ` (${p.n} games)`) : ""}</title></circle>`; });
  });
  return `<div class="cchart"><h3>${title}</h3>${s}</svg></div>`;
}
function renderCurve(){
  const box = document.getElementById("curve");
  if(!box || !CV) return;
  if(!CV.available){
    box.hidden = false;
    box.innerHTML = `<h2>${L("시간대별 격차", "Gaps over time")}</h2><div class="locked">${L(`5분마다 숫자를 아직 받지 못했습니다 — 내 판 ${CV.games ?? 0}판. 4_MyRecord.cmd 나 Update.cmd 로 내 기록을 갱신하면 받아 옵니다.`, `The 5-minute numbers aren't downloaded yet — ${CV.games ?? 0} of your games so far. Refresh your record with 4_MyRecord.cmd or Update.cmd to fetch them.`)}</div>`;
    return;
  }
  box.hidden = false;
  const tally = (gs, key) => { const c = {}; gs.forEach(g => c[key(g)] = (c[key(g)] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const posList = tally(CV.games, g => g.pos);
  if(cv.pos && !posList.some(([p]) => p === cv.pos)) cv.pos = "";
  const inPos = CV.games.filter(g => !cv.pos || g.pos === cv.pos);
  const champList = tally(inPos, g => g.champ);
  if(cv.champ && !champList.some(([c]) => c === cv.champ)) cv.champ = "";
  const gs = inPos.filter(g => !cv.champ || String(g.champ) === cv.champ);
  const tierKo = TIER_KO[hx.tier] ?? hx.tier;
  const champHasBase = cv.champ && gs.some(g => CV.champs?.[g.pos]?.[cv.champ]);
  const baseName = cv.champ ? (champHasBase ? L(`${tierKo} 보통 ${nameOf(cv.champ)}`, `Typical ${tierKo} ${nameOf(cv.champ)}`) : L(`${tierKo} ${POS_KO[gs[0]?.pos] ?? ""} 보통 (${nameOf(cv.champ)} 표본 부족)`, `Typical ${tierKo} ${POS_KO[gs[0]?.pos] ?? ""} (too few ${nameOf(cv.champ)} games)`))
    : cv.pos ? L(`${tierKo} ${POS_KO[cv.pos]} 보통`, `Typical ${tierKo} ${POS_KO[cv.pos]}`) : L(`${tierKo} 보통 (내 자리 비율)`, `Typical ${tierKo} (your role mix)`);
  const BLUE = "#3f8bee", PURPLE = "#a46ee6", WIN = "#3f8bee", LOSS = "#d96c30";
  let legend, charts;
  if(cv.mode === "group"){
    legend = [{c: BLUE, l: L(`나 ${gs.length}판`, `You · ${gs.length} games`)}, {c: PURPLE, l: baseName, d: true}];
    charts = CURVE_KEYS.map(({k, n}) => { const line = curveLine(gs, k, "all");
      return curveChart(n, k, [{label: baseName, color: PURPLE, dash: true, pts: line.map(p => ({v: p.base}))},
                               {label: L("나", "You"), color: BLUE, pts: line.map(p => ({v: p.mine, n: p.n}))}]); });
  }else{
    const w = gs.filter(g => g.win), l = gs.filter(g => !g.win);
    legend = [{c: WIN, l: L(`내 이긴 판 ${w.length}`, `Your wins ${w.length}`)}, {c: LOSS, l: L(`내 진 판 ${l.length}`, `Your losses ${l.length}`)}, {c: WIN, l: L(`${baseName} 이긴 판`, `${baseName} wins`), d: true}, {c: LOSS, l: L(`진 판`, `losses`), d: true}];
    charts = CURVE_KEYS.map(({k, n}) => { const lw = curveLine(w, k, "win"), ll = curveLine(l, k, "loss");
      return curveChart(n, k, [{label: L("보통 이긴 판", "Typical wins"), color: WIN, dash: true, pts: lw.map(p => ({v: p.base}))},

// ---------------------------------------------------------------- 최근 20판 (판마다 지표 · 내 과거와 비교)

  {n:L("라인전", "Laning"), k:"lane"}, {n:L("15분 골드", "Gold at 15"), k:"gold15"}, {n:L("15분 CS", "CS at 15"), k:"cs15"}, {n:L("15분 경험치", "XP at 15"), k:"xp15"},
  {n:L("킬 관여율", "Kill participation"), k:"kp"}, {n:L("팀 딜 비중", "Team damage share"), k:"dmgShare"}, {n:L("분당 딜량", "Damage per min"), k:"dmg"}, {n:L("데스", "Deaths"), k:"deaths"},
  {n:L("분당 시야 점수", "Vision per min"), k:"vision"}, {n:L("솔로킬", "Solo kills"), k:"solo"}, {n:"KDA", k:"kda"},
];
const tileOf = k => TILES.find(t => t.k === k);
function radarAxes(axes, series){
  const CX = 170, CY = 150, R = 104, N = axes.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N, r = R * v / 100; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
  const pts = f => axes.map((a, i) => pt(i, f(a)).map(n => n.toFixed(1)).join(",")).join(" ");
  let s = `<svg viewBox="0 0 340 300" role="img" aria-label="${L("플레이스타일", "Playstyle")}">`;
  [25, 50, 75, 100].forEach(v => s += `<polygon points="${pts(() => v)}" fill="none" stroke="var(${v === 50 ? "--ring-strong" : "--ring"})" stroke-width="1"/>`);
  axes.forEach((a, i) => { const [x, y] = pt(i, 100); s += `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ring)"/>`;
    const [lx, ly] = pt(i, 119), anchor = Math.abs(lx - CX) < 4 ? "middle" : lx > CX ? "start" : "end";
    s += `<text x="${lx.toFixed(1)}" y="${(ly + 5).toFixed(1)}" text-anchor="${anchor}">${a.n}</text>`; });
  series.forEach(ser => {
    if(ser.fill) s += `<polygon points="${pts(a => ser.vals[a.k] ?? 50)}" fill="${ser.color}" fill-opacity=".16"/>`;
    s += `<polygon points="${pts(a => ser.vals[a.k] ?? 50)}" fill="none" stroke="${ser.color}" stroke-width="2" stroke-linejoin="round"${ser.dash ? ' stroke-dasharray="5 4"' : ""}/>`;
    axes.forEach((a, i) => { const [x, y] = pt(i, ser.vals[a.k] ?? 50);
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${ser.dash ? 2.5 : 3.5}" fill="${ser.color}"><title>${ser.label} · ${a.n} ${Math.round(ser.vals[a.k] ?? 50)}</title></circle>`; });
  });
  return s + "</svg>";
}
/** 한 판의 맞은편 대비 격차 — 작은 선 그래프 */
function gapSpark(vals, title, unit){
  const W = 220, H = 120, ML = 40, R = 8, T = 10, B = 22, mins = [5, 10, 15, 20, 25, 30].slice(0, vals.length);
  if(!vals.length) return "";
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = Math.max((hi - lo) * 0.15, unit === "cs" ? 2 : 50); lo -= pad; hi += pad;
  const X = i => ML + (mins.length < 2 ? 0 : i / 5 * (W - ML - R)), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const col = vals.at(-1) >= 0 ? "var(--rec)" : "#f19a9a";
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}"><line x1="${ML}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ring-strong)"/>`;
  s += `<text x="${ML - 5}" y="${Y(hi - pad) + 4}" text-anchor="end">${hi - pad > 0 ? "+" : ""}${Math.round(hi - pad)}</text><text x="${ML - 5}" y="${Y(lo + pad) + 4}" text-anchor="end">${Math.round(lo + pad)}</text>`;
  [5, 10, 15, 20, 25, 30].forEach((m, i) => s += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${m}</text>`);
  s += `<polyline points="${vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="2"/>`;
  vals.forEach((v, i) => s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${col}"><title>${L(`${mins[i]}분`, `${mins[i]} min`)} ${v > 0 ? "+" : ""}${Math.round(v)}</title></circle>`);
  return `<div class="cchart"><h3>${title}</h3>${s}</svg></div>`;
}
function recentDetail(g){

  const tiles = keys.map(k => { const t = tileOf(k), p = pctOf(g, k);

        ${recent.map(listRow).join("")}</table></div></section>`;
  main.querySelectorAll("tr.rrow").forEach(tr => {

/** 탭 여섯 — 무엇이 궁금할 때 보는가로 나눴다.
    요약 · 추이 · 실력 · 챔피언 · 상대·팀 은 한 번 그린 섹션을 숨겼다 보였다만 하고, 최근 20판은 화면을 새로 그린다.
    주소 #skill 처럼 탭을 고르고, 마지막 탭을 기억한다. 예전 주소 #all 은 요약, #win&pos=… 같은 육각형 주소는 실력. */
const TABS = ["summary", "trend", "skill", "champ", "opp", "recent"];
const TAB_LABEL = {summary: () => L("요약", "Summary"), trend: () => L("추이", "Trend"), skill: () => L("실력", "Skill"),
                   champ: () => L("챔피언", "Champions"), opp: () => L("상대·팀", "Opponents & team"), recent: () => L("최근 20판", "Last 20 games")};
function currentTab(){
  const h = location.hash.slice(1), first = h.split("&")[0];
  if(TABS.includes(first)) return first;
  if(/(^|&)(win|loss|pos|champ|acct)(=|&|$)/.test(h)) return "skill";
  if(first === "all") return "summary";
  const saved = store.get("meTab");
  return TABS.includes(saved) ? saved : "summary";
}
const isRecent = () => currentTab() === "recent";
let drawn = false;          // 요약~상대·팀 섹션이 main 에 그려져 있나 (최근 20판이 main 을 갈아 끼운다)
function show(){
  const tab = currentTab();
  store.set("meTab", tab);
  document.querySelectorAll("nav.tabs a").forEach(a => { a.textContent = TAB_LABEL[a.dataset.view](); a.setAttribute("aria-current", a.dataset.view === tab ? "page" : "false"); });
  const main = document.getElementById("main");
  if(tab === "recent"){ drawn = false; main.removeAttribute("data-tab"); renderRecent(); window.scrollTo(0, 0); return; }
  if(!drawn){ render(); renderTier(); renderForm(); renderHex(); renderCurve(); drawn = true; }
  main.dataset.tab = tab;
  window.scrollTo(0, 0);
}
addEventListener("hashchange", show);
/** 기준 티어 — 머리 줄 한 곳에서. 한눈에 · 승패 육각형 · 시간대별 격차 · 최근 20판이 같이 바뀐다 */
function initTierSel(){
  const sel = document.getElementById("tierSel");
  sel.setAttribute("aria-label", L("기준 티어", "Tier"));
  sel.title = L("한눈에 · 승패 육각형 · 시간대별 격차 · 최근 20판이 견주는 티어", "The tier that At a glance, the win/loss hexagon, gaps over time and Last 20 games compare against");
  sel.innerHTML = Object.entries(TIER_KO).map(([t, l]) => `<option value="${t}"${t === hx.tier ? " selected" : ""}>${L(`${l} 기준`, `vs ${l}`)}</option>`).join("");
  sel.onchange = e => {
    hx.tier = e.target.value; store.set("hexTier", hx.tier);
    if(isRecent()) renderRecent(); else { renderHex(); renderForm(); renderCurve(); }

// ---------------------------------------------------------------- 승패 육각형
const HEX_AXES = [
  {k:"gold15", n:L("라인전", "Laning"), u:L("15분 골드", "Gold at 15")}, {k:"gold", n:L("골드", "Gold"), u:L("분당 골드", "Gold/min")},
  {k:"dmg", n:L("딜", "Damage"), u:L("분당 챔피언 딜", "Champion damage/min")}, {k:"kp", n:L("킬 관여", "Kill participation"), u:L("킬 관여", "Kill participation")},
  {k:"deaths", n:L("생존", "Survival"), u:L("데스 (적을수록 앞섬)", "Deaths (fewer is ahead)"), s:L("데스 (적을수록)", "Deaths (fewer is better)")}, {k:"vision", n:L("시야", "Vision"), u:L("분당 시야 점수", "Vision score/min")},
];
const HEX_EXTRA = [{k:"cs", u:L("분당 CS", "CS/min")}, {k:"kda", u:"KDA"}, {k:"solo", u:L("솔로킬", "Solo kills")}, {k:"ctrl", u:L("제어 와드", "Control wards")}];
const TIER_KO = {IRON:L("아이언", "Iron"), BRONZE:L("브론즈", "Bronze"), SILVER:L("실버", "Silver"), GOLD:L("골드", "Gold"), PLATINUM:L("플래티넘", "Platinum")};
const MODE_KO = {all:L("전체", "All"), win:L("이긴 판", "Wins"), loss:L("진 판", "Losses")};
const MODE_LC = {all:"all", win:"wins", loss:"losses"};     // 영어 문장 가운데에 들어가는 소문자
let H = null;
const store = {get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
               set(k, v){ try{ localStorage.setItem(k, v); }catch{} }};
// 주소 끝 #win&pos=BOTTOM&champ=110 처럼 그 보기부터 연다
const hash = new URLSearchParams(location.hash.slice(1));
const hx = {mode:hash.has("win") ? "win" : hash.has("loss") ? "loss" : "all", tier:store.get("hexTier") || "SILVER",
            acct:hash.get("acct") || "", pos:hash.get("pos") || "", champ:hash.get("champ") || ""};   // 계정 · 자리 · 챔피언 — 빈 값이면 전부
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

const hexAcct = () => H.games.filter(g => !hx.acct || g.account === hx.acct);
/** 계정·자리·챔피언까지 거른 판 — 승패 버튼의 판 수도 이걸 센다 */
const hexScope = () => hexAcct().filter(g => (!hx.pos || g.pos === hx.pos) && (!hx.champ || g.champ === +hx.champ));
const hexPick = () => hexScope().filter(g => hx.mode === "all" || g.win === (hx.mode === "win" ? 1 : 0));
/** 내 값: 맞은편보다 앞선 판의 비율 (동률은 반) */
const myLead = (sel, k) => { const v = avg(sel.map(g => g.lead[k]).filter(x => x != null)); return v == null ? null : v * 100; };
/** 챔피언을 골랐고 표본에 그 챔피언이 그 자리로 100쌍 넘게 있으면 그 챔피언의 기준. 아니면 null */
const champBase = g => hx.champ ? H.champs?.[g.pos]?.[String(g.champ)] ?? null : null;
/** 회색선: 같은 결과의 보통 사람. 자리를 합쳤으면 내 판의 자리 비율로 섞는다. 자리 기준의 전체는 늘 50.
 *  챔피언 기준 = 자리·티어 기준 + (챔피언 다섯 티어 합 − 자리 다섯 티어 합) — 티어 차이는 자리에서, 챔피언 차이는 합친 표본에서 */
function baseLead(sel, k){
  const T = H.tiers[hx.tier];
  return avg(sel.filter(g => T[g.pos]).map(g => {
    const w = T[g.pos].winLead[k];
    const pos = hx.mode === "all" ? 50 : hx.mode === "win" ? w : 100 - w;
    const c = champBase(g)?.lead[hx.mode]?.[k], p = H.posPooled?.[g.pos]?.lead[hx.mode]?.[k];
    return c == null || p == null ? pos : Math.min(100, Math.max(0, pos + c - p));
  }));
}
/** 절댓값은 시즌이 바뀌면 기준이 움직인다 — 내 값도 티어 평균도 이번 시즌 판으로만 */
const myMean = (cur, k) => avg(cur.map(g => g.me[k]).filter(x => x != null));
function tierMean(cur, k){
  const T = H.tiers[hx.tier];
  return avg(cur.filter(g => T[g.pos]).map(g => champBase(g)?.mean[hx.mode]?.[k] ?? T[g.pos].mean[hx.mode][k]));
}
function absFmt(k, v){
  if(v == null) return "—";
  if(k === "kp") return `${Math.round(v * 100)}%`;
  if(k === "gold15" || k === "gold" || k === "dmg") return Math.round(v).toLocaleString();
  if(k === "vision" || k === "kda" || k === "solo") return v.toFixed(2);
  return v.toFixed(1);
}
const wobble = n => Math.round(98 / Math.sqrt(n));    // 앞선 비율 50%일 때 95% 폭

/** missing: 내 값이 없는 축 — 회색선 자리에 두고 점을 안 찍는다 (0으로 그리면 크게 뒤진 것처럼 보인다) */
function hexRadar(series, missing = new Set()){
  const CX = 170, CY = 150, R = 104;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI / 3, r = R * v / 100;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
  const pts = f => HEX_AXES.map((a, i) => pt(i, f(a)).map(n => n.toFixed(1)).join(",")).join(" ");
  let s = `<svg viewBox="0 0 340 300" role="img" aria-label="${esc(series.map(x => x.label).join(", "))} ${L("육각형", "hexagon")}">`;
  [25, 50, 75, 100].forEach(v => s += `<polygon points="${pts(() => v)}" fill="none" stroke="var(${v === 50 ? "--ring-strong" : "--ring"})" stroke-width="1"/>`);
  HEX_AXES.forEach((_, i) => { const [x, y] = pt(i, 100);
    s += `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ring)" stroke-width="1"/>`; });
  HEX_AXES.forEach((a, i) => { const [x, y] = pt(i, 119);
    const anchor = Math.abs(x - CX) < 4 ? "middle" : x > CX ? "start" : "end";
    s += missing.has(a.k)
      ? `<text class="nodata" x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="${anchor}">${a.n} · ${L("자료 없음", "no data")}</text>`
      : `<text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="${anchor}">${a.n}</text>`; });
  series.forEach(ser => {
    if(ser.fill) s += `<polygon points="${pts(a => ser.vals[a.k])}" fill="var(${ser.color})" fill-opacity=".16"/>`;
    s += `<polygon points="${pts(a => ser.vals[a.k])}" fill="none" stroke="var(${ser.color})" stroke-width="2" stroke-linejoin="round"${ser.dash ? ' stroke-dasharray="5 4"' : ""}/>`;
  });
  const me = series.find(x => !x.dash);
  HEX_AXES.forEach((a, i) => { if(missing.has(a.k)) return;
    const [x, y] = pt(i, me.vals[a.k]);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(${me.color})" stroke="var(--panel)" stroke-width="2"/>`
      + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="transparent"><title>${a.n} · ${a.u}\n${
        series.map(ser => `${ser.label} ${Math.round(ser.vals[a.k])}%`).join("\n")}</title></circle>`; });
  return s + "</svg>";
}

function renderHex(){
  const box = document.getElementById("hex");
  if(!box || !H?.available) return;
  box.hidden = false;
  const tally = (gs, key) => { const c = {}; gs.forEach(g => c[key(g)] = (c[key(g)] || 0) + 1);
    return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const accounts = tally(H.games, g => g.account);
  if(hx.acct && !accounts.some(([a]) => a === hx.acct)) hx.acct = "";
  const acctGames = hexAcct();
  const positions = tally(acctGames, g => g.pos);
  if(hx.pos && !positions.some(([p]) => p === hx.pos)) hx.pos = "";
  const champs = tally(acctGames.filter(g => !hx.pos || g.pos === hx.pos), g => g.champ);
  if(hx.champ && !champs.some(([c]) => c === hx.champ)) hx.champ = "";     // 자리를 바꿔 그 자리에 없는 챔피언
  const sel = hexPick(), n = sel.length, cur = sel.filter(g => g.season === H.season);
  const scope = hexScope();
  const comp = tally(scope, g => g.pos).map(([p, c]) => `${POS_KO[p] ?? p} ${c}`).join(" · ");
  const mixed = new Set(scope.map(g => g.pos)).size > 1;
  const tierKo = TIER_KO[hx.tier];
  const cInfo = scope.map(champBase).find(Boolean);           // 챔피언 회색선을 쓰나
  const cName = hx.champ ? nameOf(hx.champ) : "";
  const cPos = scope.length ? POS_KO[scope[0].pos] ?? scope[0].pos : "";

  let body;
  if(n < H.minGames){
    body = `<div class="locked">${L(`${MODE_KO[hx.mode]} ${n}판 — ${H.minGames}판부터 보여 줍니다`, `${MODE_KO[hx.mode]}: ${n} games — shown from ${H.minGames} games`)}</div>`;
  }else{
    const mine = {}, base = {};
    const missing = new Set(HEX_AXES.filter(a => myLead(sel, a.k) == null).map(a => a.k));
    HEX_AXES.forEach(a => { base[a.k] = baseLead(sel, a.k) ?? 50; mine[a.k] = myLead(sel, a.k) ?? base[a.k]; });
    const baseLabel = cInfo ? (hx.mode === "all" ? L(`보통 ${cName}`, `Average ${cName}`) : L(`${tierKo} ${MODE_KO[hx.mode]} 보통 ${cName}`, `Average ${tierKo} ${cName} (${MODE_LC[hx.mode]})`))
      : hx.mode === "all" ? L("맞은편과 동률", "Even with lane opponent") : L(`${tierKo} ${MODE_KO[hx.mode]} 보통`, `Average ${tierKo} (${MODE_LC[hx.mode]})`);
    const baseWobble = cInfo ? L(`<br>회색선도 표본 ${cInfo.n[hx.mode].toLocaleString()}쌍이라 ±${wobble(cInfo.n[hx.mode])}%p 흔들립니다.`,
      `<br>The gray line also comes from ${cInfo.n[hx.mode].toLocaleString()} pairs, so it can swing ±${wobble(cInfo.n[hx.mode])}pp.`) : "";
    const ser = [{label: baseLabel, vals: base, color: "--dim", dash: true},
                 {label: L("나", "You"), vals: mine, color: hx.mode === "loss" ? "--loss" : "--win", fill: true}];
    const w = wobble(n);
    const gaps = HEX_AXES.filter(a => !missing.has(a.k)).map(a => ({a, g: mine[a.k] - base[a.k]})).sort((x, y) => x.g - y.g);
    const noLane = missing.has("gold15") ? `<br>${L("라인전은 15분 타임라인을 아직 못 받아 비워 뒀습니다. 4_MyRecord.cmd 를 다시 실행하면 받아 옵니다.",
      "Laning is left out because the 15-minute timelines haven't been downloaded yet. Run 4_MyRecord.cmd again to fetch them.")}` : "";
    const row = x => `<div class="${Math.abs(x.g) < w ? "noise" : ""}"><span>${x.a.n}</span>
      <span>${L("나", "You")} ${Math.round(mine[x.a.k])} · ${L("보통", "avg")} ${Math.round(base[x.a.k])} → <b>${x.g >= 0 ? "+" : "−"}${Math.abs(x.g).toFixed(0)}${PP}</b></span></div>`;
    const more = [50, 100].filter(m => m > n).map(m => L(`${m}판이면 ±${wobble(m)}`, `±${wobble(m)} at ${m} games`)).join(", ");
    const tRow = a => {
      const me = myLead(sel, a.k), b = baseLead(sel, a.k);
      return `<tr><td>${a.s ?? a.u}</td><td>${me == null ? "—" : Math.round(me) + "%"} <span class="base">/ ${b == null ? "—" : Math.round(b) + "%"}</span></td>
        <td>${absFmt(a.k, myMean(cur, a.k))}</td><td>${absFmt(a.k, tierMean(cur, a.k))}</td></tr>`;
    };
    const legend = `<div class="legend">` + ser.map(x => `<span><i class="${x.dash ? "dash" : ""}" style="border-color:var(${x.color})"></i>${x.label}</span>`).join("")
      + `<span><i style="border-color:var(--ring-strong);border-top-width:1px"></i>${L("진한 선 50%", "Bold ring 50%")}</span></div>`;
    // 위아래 둘씩 — 단, 보통보다 뒤진 축을 "앞선 축"에 넣지는 않는다
    // 반올림해서 0인 축은 어느 쪽에도 넣지 않는다 ("+0%p 앞선 축"이 되지 않게)
    const behind = gaps.filter(x => Math.round(x.g) < 0).slice(0, 2), ahead = gaps.filter(x => Math.round(x.g) > 0).reverse().slice(0, 2);
    const list = (xs, none) => xs.length ? xs.map(row).join("") : `<div class="noise"><span>${none}</span></div>`;
    body = `<div class="hexbody">
        <div>${legend}${hexRadar(ser, missing)}</div>
        <div class="gaps"><h3>${L("보통보다 가장 뒤처진 축", "Furthest behind average")}</h3>${list(behind, L("없습니다", "None"))}
          <h3>${L("보통보다 가장 앞선 축", "Furthest ahead of average")}</h3>${list(ahead, L("없습니다", "None"))}
          <div class="wobble"><b>${L(`${n}판 기준 · 축마다 ±${w}%p 흔들릴 수 있습니다`, `Based on ${n} games · each axis can swing ±${w}pp`)}</b>${more ? ` · ${more}` : ""}<br>
            ${L("흐린 줄은 차이가 흔들림 폭 안이라 아직 우연과 가려지지 않습니다.", "Faded rows are within that margin, so they can't yet be told apart from chance.")}${baseWobble}${noLane}</div></div>
      </div>
      <div class="tw" style="margin-top:14px"><table class="hextable">
        <tr><th>${L("지표", "Stat")}</th><th title="${L("앞 숫자: 내 판 중 맞은편 라이너보다 그 값이 좋았던 판의 비율 · 뒤 숫자: 같은 조건의 일반적인 게임에서 그 비율", "First number: share of your games where you beat your lane opponent on this stat · second: the same share in a typical game under the same conditions")}">${L("상대보다 잘했던 게임 /<br>일반적인 게임", "Games ahead of opponent /<br>typical game")}</th><th>${L(`나 · 시즌 ${H.season} ${cur.length}판`, `You · season ${H.season}, ${cur.length} games`)}</th><th>${L(`${cInfo ? `보통 ${cName}` : tierKo}${hx.mode === "all" ? "" : " " + MODE_KO[hx.mode]} 평균`, `${cInfo ? cName : tierKo} avg${hx.mode === "all" ? "" : ` (${MODE_LC[hx.mode]})`}`)}</th></tr>
        ${HEX_AXES.map(tRow).join("")}${HEX_EXTRA.map(tRow).join("")}</table></div>`;
  }

  const count = m => m === "all" ? scope.length : scope.filter(g => g.win === (m === "win" ? 1 : 0)).length;
  const opt = (v, label, on) => `<option value="${v}"${on ? " selected" : ""}>${esc(label)}</option>`;
  const note = cInfo ? L(`회색선은 보통 ${cName} — 다섯 티어를 합쳐 잰 챔피언 차이를 ${tierKo} ${cPos} 기준에 더했습니다`,
      `the gray line is an average ${cName} — the champion gap measured across all five tiers, added to the ${tierKo} ${cPos} baseline`)
    : hx.champ ? L(`표본의 ${cName} ${cPos} 판이 ${H.champMin ?? 100}쌍이 안 돼 회색선은 ${cPos} 보통 사람입니다 — 챔피언 차이가 섞입니다`,
      `the sample has fewer than ${H.champMin ?? 100} ${cName} ${cPos} pairs, so the gray line is an average ${cPos} player — champion differences are mixed in`)
    : mixed ? L("자리를 합쳐서 보고, 회색선은 내 판의 자리 비율로 섞습니다", "positions are combined, and the gray line is blended by your games' position mix") : "";
  box.innerHTML = `<h2>${L("승패 육각형", "Win/loss hexagon")}</h2>
    <div class="sub">${L("맞은편 라이너보다 앞선 판의 비율 · 솔로랭크 15분 넘은 판", "Share of games ahead of your lane opponent · Solo/Duo games over 15 min")} · ${comp}${note ? ` — ${note}` : ""}</div>
    <div class="hexbar">
      <div class="seg" role="group" aria-label="${L("승패", "Win/loss")}">${Object.entries(MODE_KO).map(([m, l]) =>
        `<button type="button" data-mode="${m}" aria-pressed="${m === hx.mode}">${l} ${count(m)}</button>`).join("")}</div>
      ${accounts.length > 1 ? `<select id="hexAcct" aria-label="${L("계정", "Account")}">${opt("", L(`계정 전체 ${H.games.length}`, `All accounts ${H.games.length}`), !hx.acct)}${
        accounts.map(([a, c]) => opt(a, `${a} ${c}`, a === hx.acct)).join("")}</select>` : ""}
      <select id="hexPos" aria-label="${L("자리", "Position")}">${opt("", L(`자리 전체 ${acctGames.length}`, `All positions ${acctGames.length}`), !hx.pos)}${positions.map(([p, c]) =>
        opt(p, `${POS_KO[p] ?? p} ${c}`, p === hx.pos)).join("")}</select>
      <select id="hexChamp" aria-label="${L("챔피언", "Champion")}">${opt("", L("챔피언 전체", "All champions"), !hx.champ)}${champs.map(([c, k]) =>
        opt(c, L(`${nameOf(c)} ${k}판${k < H.minGames ? " · 10판 미만" : ""}`, `${nameOf(c)} ${k} games${k < H.minGames ? " · under 10" : ""}`), c === hx.champ)).join("")}</select>
    </div>
    ${body}
    <div class="foot" style="margin-top:10px">${L(`기준은 ${H.patch} 패치 티어마다 1,000판에서 잰 값입니다. 앞선 비율은 패치·MMR이 같은 맞은편과 비교해서 옛 판도 그대로 씁니다.
      표의 절댓값만 시즌마다 기준이 움직여서 이번 시즌 판으로 셉니다.`,
      `Baselines are measured from 1,000 games per tier on patch ${H.patch}. Lead shares compare you with a lane opponent on the same patch and MMR, so older games still count.
      Only the table's absolute values shift with each season, so they use this season's games.`)} ${cInfo
        ? L("챔피언 보기에서는 전체 보기의 회색선도 그 챔피언의 값이고(다섯 티어 합), 티어는 이긴 판·진 판의 회색선을 바꿉니다.",
            "In champion view, the All gray line is that champion's value too (all five tiers pooled); the tier changes the gray line for wins and losses.")
        : L("전체 보기의 회색선은 티어와 상관없이 50이고, 티어는 표의 평균을 바꿉니다.",
            "In the All view the gray line is 50 regardless of tier; the tier changes the table's averages.")}</div>`;

  box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { hx.mode = b.dataset.mode; renderHex(); });
  const acct = box.querySelector("#hexAcct");
  if(acct) acct.onchange = e => { hx.acct = e.target.value; renderHex(); };
  box.querySelector("#hexPos").onchange = e => { hx.pos = e.target.value; renderHex(); };
  box.querySelector("#hexChamp").onchange = e => { hx.champ = e.target.value; renderHex(); };
}

(async function(){
  try{
    D = await fetch(`/api/me/summary?lang=${LANG}`).then(r => r.json());
  }catch{ D = {available:false}; }
  if(!D.available){
    document.getElementById("main").innerHTML = `<div class="empty">${L(`아직 받은 내 경기가 없습니다.<br>
       <code>4_MyRecord.cmd</code> 를 실행해 Riot ID를 적으면 받아 옵니다.`, `No games of yours have been fetched yet.<br>
       Run <code>4_MyRecord.cmd</code> and enter your Riot ID to fetch them.`)}</div>`;
    return;
  }
  initTierSel();
  show();
  fetch("/api/me/tier").then(r => r.json()).then(d => { TG = d; renderTier(); }).catch(() => {});
  fetch("/api/me/form").then(r => r.json()).then(d => { FM = d; renderForm(); if(isRecent()) renderRecent(); }).catch(e => console.error(e));
  fetch("/api/me/curve").then(r => r.json()).then(d => { CV = d; renderCurve(); }).catch(e => console.error(e));
  try{ H = await fetch(`/api/me/hexagon?lang=${LANG}`).then(r => r.json()); }catch{ H = null; }
  if(H?.available && !H.tiers[hx.tier]){ hx.tier = "SILVER"; initTierSel(); }
  renderHex();
})();
</script>
</body>
</html>
